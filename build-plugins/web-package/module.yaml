# The plugin that links the web codec modules with emscripten and puts them, with their build record and
# licence texts, at the root of the jar of kiteffmpeg-web or kiteffmpeg-web-async. The logic is in native-build.
product: jvm/amper-plugin

dependencies:
  - //build-plugins/native-build

settings:
  kotlin:
    version: 2.4.21
  jvm:
    jdk:
      version: 21

pluginInfo:
  settingsClass: io.github.yuroyami.kiteffmpeg.webpackage.WebPackageSettings
