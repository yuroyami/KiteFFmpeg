      transcriptDir: ${project.rootDir}/build/contract-transcripts

  desktopJni:
    action: !io.github.yuroyami.kiteffmpeg.plugin.checkDesktopJni
      platforms: [ macos-arm64, linux-x64, linux-arm64, windows-x64 ]
      resourcesDirs:
        - ${tasks.jniMacosArm64.action.resourcesDir}
        - ${tasks.jniLinuxX64.action.resourcesDir}
        - ${tasks.jniLinuxArm64.action.resourcesDir}
        - ${tasks.jniWindowsX64.action.resourcesDir}

