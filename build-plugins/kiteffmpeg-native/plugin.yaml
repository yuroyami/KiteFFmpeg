    action: !io.github.yuroyami.kiteffmpeg.plugin.compileWasmHelper
      cSources: ${project.rootDir}/native/kitecodec-c/src
      cInclude: ${project.rootDir}/native/kitecodec-c/include
      handleSources: ${project.rootDir}/native/kitecodec-handles
      ffmpegTree: ${tasks.bakeFFmpegWasm.action.outputDir}
      outputDir: ${project.rootDir}/native-libs/deps/wasm32/kiteffmpeg

  wasmModule:
    action: !io.github.yuroyami.kiteffmpeg.plugin.linkWasmModule
      helperDir: ${tasks.wasmHelper.action.outputDir}
      ffmpegTree: ${tasks.bakeFFmpegWasm.action.outputDir}
      signatureBaseline: ${project.rootDir}/native/kitecodec-c/signature-baseline.txt
      outputDir: ${project.rootDir}/build/kite-web

  asyncWasmModules:
    action: !io.github.yuroyami.kiteffmpeg.plugin.linkAsyncWasmModules
      helperDir: ${tasks.wasmHelper.action.outputDir}
      ffmpegTree: ${tasks.bakeFFmpegWasm.action.outputDir}
      signatureBaseline: ${project.rootDir}/native/kitecodec-c/signature-baseline.txt
      bridgeSource: ${project.rootDir}/native/kitecodec-web/kite_async_bridge.c
      importsLibrary: ${project.rootDir}/native/kitecodec-web/kite_async_imports.js
      cInclude: ${project.rootDir}/native/kitecodec-c/include
      handleSources: ${project.rootDir}/native/kitecodec-handles
      outputDir: ${project.rootDir}/build/kite-web-async

  asyncWasmModulesCheck:
    action: !io.github.yuroyami.kiteffmpeg.plugin.checkAsyncWasmModules
      modulesDir: ${tasks.asyncWasmModules.action.outputDir}
      testsDir: ${project.rootDir}/native/kitecodec-web/tests

  webZip:
    action: !io.github.yuroyami.kiteffmpeg.plugin.zipWebModule
      moduleDir: ${tasks.wasmModule.action.outputDir}
      ffmpegTree: ${project.rootDir}/native-libs/lgpl/wasm32
      licenseFiles:
        - ${module.rootDir}/resources@jvm/META-INF/licenses/kiteffmpeg-ffmpeg/COPYING.LGPLv2.1
        - ${module.rootDir}/web/licenses/THIRD-PARTY.txt
      version: ${module.settings.publishing.version}
      classifier: web
      zipDir: ${project.rootDir}/build/kite-web-zip/web

  webAsyncZip:
    action: !io.github.yuroyami.kiteffmpeg.plugin.zipWebModule
      moduleDir: ${tasks.asyncWasmModules.action.outputDir}
      ffmpegTree: ${project.rootDir}/native-libs/lgpl/wasm32
      licenseFiles:
        - ${module.rootDir}/resources@jvm/META-INF/licenses/kiteffmpeg-ffmpeg/COPYING.LGPLv2.1
        - ${module.rootDir}/web/licenses/THIRD-PARTY.txt
      version: ${module.settings.publishing.version}
      classifier: web-async
      zipDir: ${project.rootDir}/build/kite-web-zip/web-async

