# Tasks of the kiteffmpeg module. The build tasks read the FFmpeg trees in native-libs/ and never build them.
# `./kotlin do buildFFmpegFor<Target>` builds a tree. The repository layout fixes the paths.

tasks:
  ffmpegInteropMacosArm64:
    action: !io.github.yuroyami.kiteffmpeg.plugin.prepareFFmpegInterop
      konanTarget: macos_arm64
      repoRoot: ${project.rootDir}
      homebrewPrefix: ${pluginSettings.homebrewPrefix}
      kotlinVersion: ${pluginSettings.kotlinVersion}
      cSources: ${project.rootDir}/native/kitecodec-c/src
      cInclude: ${project.rootDir}/native/kitecodec-c/include
      defTemplates: ${module.rootDir}/interop
      ffmpegTree: ${project.rootDir}/native-libs/lgpl/macos-arm64
      archiveDir: ${taskOutputDir}/macos_arm64
      defFile: ${taskOutputDir}/def/ffmpeg.def

