      repoRoot: ${project.rootDir}
      kotlinVersion: ${pluginSettings.kotlinVersion}
      dav1dTree: ${tasks.bakeDav1dMacosArm64.action.outputDir}
      outputDir: ${project.rootDir}/native-libs/lgpl/macos-arm64

