# The plugin that builds the native parts of the kiteffmpeg module: the ffmpeg cinterop of each native
# target, the desktop JNI libraries inside the JVM jar, the FFmpeg builds (`./kotlin do ...`) and the
# consistency checks (`./kotlin check ...`). The logic is in native-build.
product: jvm/amper-plugin

dependencies:
  - //build-plugins/native-build

settings:
  kotlin:
    version: 2.4.21
  jvm:
    jdk:
      version: 21

pluginInfo:
  settingsClass: io.github.yuroyami.kiteffmpeg.plugin.KiteFFmpegNativeSettings
