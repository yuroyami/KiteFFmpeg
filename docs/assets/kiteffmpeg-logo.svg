  <title id="kiteffmpeg-logo-title">KiteFFmpeg logo</title>
  <desc id="kiteffmpeg-logo-desc">A wind-loaded violet, magenta, plum, and coral diamond kite sharing KitePlayer's silhouette, with the official white FFmpeg mark pressed into its sail.</desc>
  <metadata>
    The official FFmpeg PNG is embedded unmodified for provenance. The rendered inlay uses the graphic-only path from the credited Wikimedia Commons vectorisation: https://commons.wikimedia.org/wiki/File:FFmpeg_Logo_new.svg. FFmpeg is a trademark of Fabrice Bellard. This independent concept is not affiliated with or endorsed by the FFmpeg project.
  </metadata>

