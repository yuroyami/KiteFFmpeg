<!doctype html>
<html><head><meta charset="utf-8"><title>KitePlayer web</title>
<style>
 html,body{margin:0;height:100%;background:#0b0b0f;color:#ddd;font:13px system-ui}
 #wrap{display:flex;flex-direction:column;height:100%}
 canvas{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
 #hud{padding:8px 12px;font-variant-numeric:tabular-nums;white-space:pre}
</style></head>
<body><div id="wrap"><canvas id="c"></canvas><div id="hud">loading…</div></div>
<script type="module">
import factory from "./kite.mjs";
const hud = document.getElementById("hud");
const canvas = document.getElementById("c");
const say = (t) => { hud.textContent = t; };
try {
  const M = await factory();
  const bytes = new Uint8Array(await (await fetch("clip.mp4")).arrayBuffer());
  let pos = 0;
  const readFn = M.addFunction((op, buf, len) => {
    if (pos >= bytes.length) return -541478725;
    const n = Math.min(len, bytes.length - pos);
    M.HEAPU8.set(bytes.subarray(pos, pos + n), buf); pos += n; return n;
  }, "iiii");
  const seekFn = M.addFunction((op, off, wh) => {
    const o = Number(off), w = Number(wh);
    if (w === 0x10000) return BigInt(bytes.length);
    if (w === 0) pos = o; else if (w === 1) pos += o; else if (w === 2) pos = bytes.length + o; else return -1n;
    return BigInt(pos);
  }, "jiji");

  const outPtr = M._malloc(4);
  if (M._ffkmp_fmt_open_input_io(outPtr, 0, readFn, seekFn, BigInt(bytes.length), 0, 0, 0, 0) < 0) throw new Error("open failed");
  const ctx = M.HEAPU32[outPtr >> 2];
  M._ffkmp_fmt_find_stream_info(ctx);
  const n = M._ffkmp_fmt_nb_streams(ctx);
  let vi = -1, par = 0;
  for (let i = 0; i < n; i++) {
    const p = M._ffkmp_stream_codecpar(M._ffkmp_fmt_stream(ctx, i));
    if (M._ffkmp_codecpar_codec_type(p) === M._ffkmp_media_type_video()) { vi = i; par = p; break; }
  }
  const codec = M._ffkmp_find_decoder_by_id(M._ffkmp_codecpar_codec_id(par));
  const dec = M._ffkmp_codecctx_alloc(codec);
  M._ffkmp_codecctx_from_par(dec, par);
  M._ffkmp_codecctx_open(dec, codec);
  const W = M._ffkmp_codecpar_width(par), H = M._ffkmp_codecpar_height(par);
  canvas.width = W; canvas.height = H;
  const g = canvas.getContext("2d");
  const rgbaFmt = M.ccall("ffkmp_pix_fmt_from_name", "number", ["string"], ["rgba"]);
  const size = M._ffkmp_image_get_buffer_size(rgbaFmt, W, H, 1);
  const buf = M._malloc(size);
  const image = g.createImageData(W, H);
  const pkt = M._ffkmp_packet_alloc(), frame = M._ffkmp_frame_alloc();

  // ---- Audio: decode, then resample through a filter graph to the one format Web Audio takes.
  // The graph is deliberate rather than reading planes raw: it guarantees planar float at a fixed
  // rate whatever the source was, which is what a player must do, and it exercises the avfilter
  // build the web profile had to add back.
  let ai = -1, apar = 0;
  for (let i = 0; i < n; i++) {
    const p = M._ffkmp_stream_codecpar(M._ffkmp_fmt_stream(ctx, i));
    if (M._ffkmp_codecpar_codec_type(p) === M._ffkmp_media_type_audio()) { ai = i; apar = p; break; }
  }
  let adec = 0, graphSrc = 0, graphSink = 0, aframe = 0, audioCtx = null;
  let audioFrames = 0, audioSamples = 0, peak = 0, RATE = 48000, CH = 2;
  if (ai >= 0) {
    const acodec = M._ffkmp_find_decoder_by_id(M._ffkmp_codecpar_codec_id(apar));
    adec = M._ffkmp_codecctx_alloc(acodec);
    M._ffkmp_codecctx_from_par(adec, apar);
    M._ffkmp_codecctx_open(adec, acodec);
    const fltp = M.ccall("ffkmp_sample_fmt_from_name", "number", ["string"], ["fltp"]);
    const srcRate = M._ffkmp_codecpar_sample_rate(apar);
    const srcCh = M._ffkmp_codecpar_channels(apar);
    const srcFmt = M._ffkmp_codecctx_sample_fmt ? M._ffkmp_codecctx_sample_fmt(adec) : fltp;
    const gp = M._malloc(12);
    const rc2 = M.ccall("ffkmp_graph_build_audio", "number",
      ["number","number","number","string","number","number","number","number","number","number","number","number"],
      [gp, gp + 4, gp + 8, "anull", srcRate, srcFmt, srcCh, 1, srcRate, fltp, RATE, CH]);
    if (rc2 >= 0) {
      graphSrc = M.HEAPU32[(gp + 4) >> 2];
      graphSink = M.HEAPU32[(gp + 8) >> 2];
      aframe = M._ffkmp_frame_alloc();
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: RATE });
    }
    M._free(gp);
  }
  let audioTime = 0;
  function pushAudio() {
    if (!graphSink || !audioCtx) return;
    while (M._ffkmp_graph_receive(graphSink, aframe) >= 0) {
      const ns = M._ffkmp_frame_nb_samples(aframe);
      if (ns <= 0) { M._ffkmp_frame_unref(aframe); continue; }
      const ab = audioCtx.createBuffer(CH, ns, RATE);
      for (let c = 0; c < CH; c++) {
        const plane = M._ffkmp_frame_plane(aframe, c);
        const src = new Float32Array(M.HEAPU8.buffer, plane, ns);
        ab.getChannelData(c).set(src);
        for (let k = 0; k < ns; k += 97) { const v = Math.abs(src[k]); if (v > peak) peak = v; }
      }
      const node = audioCtx.createBufferSource();
      node.buffer = ab; node.connect(audioCtx.destination);
      const at = Math.max(audioCtx.currentTime, audioTime);
      node.start(at); audioTime = at + ns / RATE;
      audioFrames++; audioSamples += ns;
      M._ffkmp_frame_unref(aframe);
    }
  }

  let frames = 0, t0 = performance.now(), convMs = 0, drawMs = 0, done = false;
  function pump() {
    if (done) return;
    const deadline = performance.now() + 12;
    while (performance.now() < deadline) {
      if (M._ffkmp_fmt_read_frame(ctx, pkt) < 0) { done = true; break; }
      const si = M._ffkmp_packet_stream_index(pkt);
      if (si === ai && adec && M._ffkmp_codecctx_send_packet(adec, pkt) >= 0) {
        while (M._ffkmp_codecctx_receive_frame(adec, aframe ? frame : frame) >= 0) {
          if (graphSrc) { M._ffkmp_graph_send(graphSrc, frame); pushAudio(); }
          M._ffkmp_frame_unref(frame);
        }
      }
      const isV = si === vi;
      if (isV && M._ffkmp_codecctx_send_packet(dec, pkt) >= 0) {
        while (M._ffkmp_codecctx_receive_frame(dec, frame) >= 0) {
          const a = performance.now();
          const conv = M._ffkmp_frame_convert_pixfmt(frame, rgbaFmt);
          M._ffkmp_frame_copy_to_buffer(conv, buf, size);
          M._ffkmp_frame_free(conv);
          const b = performance.now();
          image.data.set(M.HEAPU8.subarray(buf, buf + size));
          g.putImageData(image, 0, 0);
          const c = performance.now();
          convMs += b - a; drawMs += c - b; frames++;
        }
      }
      M._ffkmp_packet_unref(pkt);
      if (frames > 0) break;
    }
    const secs = (performance.now() - t0) / 1000;
    say(`video ${frames}f  convert ${(convMs/Math.max(frames,1)).toFixed(1)}ms  draw ${(drawMs/Math.max(frames,1)).toFixed(2)}ms  ${W}x${H}\n` +
        `audio ${audioFrames}f  ${audioSamples} samples  ${(audioSamples/RATE).toFixed(2)}s  peak ${peak.toFixed(3)}  ${RATE}Hz x${CH}` + (done ? "  [end]" : ""));
    requestAnimationFrame(pump);
  }
  requestAnimationFrame(pump);
} catch (e) { say("ERROR: " + e.message); console.error(e); }
</script></body></html>
