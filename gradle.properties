#Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configuration-cache=true

#Kotlin
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.apple.xcodeCompatibility.nowarn=true

#Dokka (v2 generator, aggregated API site at build/dokka/html)
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

#Library coordinates
GROUP=io.github.yuroyami
VERSION=0.2.0
DESCRIPTION=KiteFFmpeg: a coroutine-first Kotlin Multiplatform API for video and audio: demux, decode, filter, encode, mux, transcode and remux, over FFmpeg's libav* libraries. FFmpeg (LGPL) and the dav1d AV1 decoder are embedded in the published native artifacts, so no FFmpeg install, Gradle plugin or linker setup is needed. Hardware video via VideoToolbox and MediaCodec.

#FFmpeg paths, overridden by buildSrc per target. This is the macOS dev default.
kiteffmpeg.macos.homebrew.prefix=/opt/homebrew


kotlin.native.ignoreDisabledTargets=true
