# A small Android app that loads the JNI library of kiteffmpeg on a device or an emulator and checks it.
# The Kotlin Toolchain cannot run Android instrumented tests, so scripts/android-device-check.sh installs
# this app, starts it and reads its result from the log.
product: android/app

dependencies:
  - //kiteffmpeg

settings:
  kotlin:
    version: 2.4.21
  jvm:
    jdk:
      version: 21
  android:
    namespace: io.github.yuroyami.kiteffmpeg.check
    applicationId: io.github.yuroyami.kiteffmpeg.check
    compileSdk:
      apiLevel: 37
      minorApiLevel: 2
    minSdk: 26
