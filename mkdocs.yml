site_name: KiteFFmpeg
site_url: https://yuroyami.github.io/KiteFFmpeg/
site_description: >-
  Kotlin Multiplatform codec engine: coroutine-first video and audio decode,
  encode, transcode and filter graphs via Kotlin/Native FFmpeg bindings.
site_author: yuroyami
copyright: Copyright &copy; 2026 yuroyami, Apache-2.0

repo_name: yuroyami/KiteFFmpeg
repo_url: https://github.com/yuroyami/KiteFFmpeg
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/movie-open-play
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      title: On this page
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - theme/kite.css

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yuroyami/KiteFFmpeg
    - icon: material/package-variant-closed
      link: https://central.sonatype.com/namespace/io.github.yuroyami

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guides:
      - Transcoding: transcoding.md
      - Decoding frames: decoding.md
      - Filter graphs: filtering.md
      - Encoding and muxing: encoding-muxing.md
      - Remuxing: remuxing.md
      - Concurrency: concurrency.md
  - Reference:
      - Recipes: recipes.md
      - Platform support: platforms.md
      - Licensing: licensing.md
      - Troubleshooting: troubleshooting.md
      - About and status: about.md
      - API reference ▸: https://yuroyami.github.io/KiteFFmpeg/api/
