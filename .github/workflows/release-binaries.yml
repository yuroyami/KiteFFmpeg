# Builds the vendored static FFmpeg for EVERY supported target and publishes the zips as assets
# of the FFMPEG-keyed release tag (ffmpeg-<version>), which is the single canonical home for
# them: the binaries depend on the FFmpeg version, not on KiteCodec's, so KiteCodec version
# releases carry release notes only and publish.yml fetches from this tag.
#
# Since KC-EMBED (2026-08-22) there is NO flavour axis: dav1d is mandatory in every build, and no Gradle plugin exists; these zips are the build
# evidence, the LGPL source-offer anchor, and the input the publication pipeline unpacks into
# native-libs/ before embedding FFmpeg INTO the published klibs. Assets are named
# `ffmpeg-<ffversion>-<license>-<triple>.zip` (+ `.sha256`).
#
# Structure: every build job uploads its zips as workflow artifacts; the single `publish` job at
# the end downloads them all, attests build provenance, and creates/updates the release exactly
# once (avoids the race of several jobs mutating the same release tag concurrently).
#
# FULL COVERAGE BY CONSTRUCTION (owner decision 2026-08-22). Every profile is portable: the
# shared software playback core plus platform services, no third-party desktop stack, so every
# triple builds on a stock runner:
#   - android arm64 / arm32 / x64: NDK clang, MediaCodec. Self-contained by profile.
#   - ios-arm64 / ios-simulator-arm64 / ios-x64, macos-arm64 / macos-x64: Xcode clang,
#     VideoToolbox/AudioToolbox from the SDK. macOS additionally gets the VideoToolbox encoders.
#   - linux-x64 / linux-arm64 / mingw-x64: konan's own clang over konan's own sysroot (decision
#     W-D3), which is the toolchain the consumer's Kotlin/Native link uses. The konan warmup step
#     is what drops that toolchain into ~/.konan/dependencies.
# Every job cross-builds dav1d first (meson/ninja/nasm) and bakes it into libavcodec: FFmpeg
# has no native software AV1 decoder, so dav1d is the recipe, not an option.
#
# Manual trigger only: this is a release pipeline, not a per-push check.
name: Release FFmpeg binaries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach the binaries to. Keep it FFmpeg-keyed (ffmpeg-n8.0): the zips are identical across KiteCodec versions and publish.yml fetches from exactly this tag."
        required: true
        default: "ffmpeg-n8.0"
      ffmpeg_version:
        description: "FFmpeg source tag to build (e.g. n8.0)"
        required: true
        default: "n8.0"
      dav1d_version:
        description: "dav1d source tag (must equal BuildDav1dTask.DEFAULT_SOURCE_REF)"
        required: true
        default: "1.5.4"

permissions:
  contents: read

concurrency:
  group: release-ffmpeg-${{ github.event.inputs.release_tag }}
  cancel-in-progress: false

jobs:
  android:
    name: android ${{ matrix.abi }} (lgpl)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64, arm32, x64]
        include:
          - { abi: arm64, triple: android-arm64, task: AndroidArm64 }
          - { abi: arm32, triple: android-arm32, task: AndroidArm32 }
          - { abi: x64,   triple: android-x64,   task: AndroidX64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # meson + ninja + nasm are dav1d's build system and assembler (nasm for the x64 ABI).
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build nasm
      - name: Clone FFmpeg ${{ github.event.inputs.ffmpeg_version }}
        run: git clone --depth 1 --branch ${{ github.event.inputs.ffmpeg_version }} https://github.com/FFmpeg/FFmpeg.git vendor/ffmpeg
      - name: Clone dav1d ${{ github.event.inputs.dav1d_version }}
        run: git clone --depth 1 --branch ${{ github.event.inputs.dav1d_version }} https://code.videolan.org/videolan/dav1d.git vendor/dav1d
      # The bake depends on the dav1d task since KC-EMBED, so one Gradle call builds both.
      - name: Build FFmpeg (NDK, dav1d inside)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./gradlew :kitecodec-core:buildFFmpegFor${{ matrix.task }} \
            -Pkitecodec.ffmpeg.selfContained=true --stacktrace
      - name: Package
        run: bash .github/scripts/package-ffmpeg.sh "${{ github.event.inputs.ffmpeg_version }}" lgpl ${{ matrix.triple }}
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-lgpl-${{ matrix.triple }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  apple:
    name: ${{ matrix.triple }} (lgpl)
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        triple: [ios-arm64, ios-simulator-arm64, ios-x64, macos-arm64, macos-x64]
        include:
          - { triple: ios-arm64,            task: IosArm64 }
          - { triple: ios-simulator-arm64,  task: IosSimulatorArm64 }
          - { triple: ios-x64,              task: IosX64 }
          - { triple: macos-arm64,          task: MacosArm64 }
          - { triple: macos-x64,            task: MacosX64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # meson/ninja are dav1d's build system; nasm assembles the x86_64 asm for BOTH dav1d and
      # FFmpeg on the two Intel triples, so it is installed unconditionally.
      - name: Install build deps
        run: brew install meson ninja nasm
      - name: Clone FFmpeg ${{ github.event.inputs.ffmpeg_version }}
        run: git clone --depth 1 --branch ${{ github.event.inputs.ffmpeg_version }} https://github.com/FFmpeg/FFmpeg.git vendor/ffmpeg
      - name: Clone dav1d ${{ github.event.inputs.dav1d_version }}
        run: git clone --depth 1 --branch ${{ github.event.inputs.dav1d_version }} https://code.videolan.org/videolan/dav1d.git vendor/dav1d
      # The bake depends on the dav1d task since KC-EMBED, so one Gradle call builds both.
      # -Pkitecodec.ffmpeg.selfContained=true: a Release asset must link on a machine that has
      # nothing installed; with the portable profile the only bundleable archive is dav1d itself.
      - name: Build FFmpeg (dav1d inside)
        run: |
          ./gradlew :kitecodec-core:buildFFmpegFor${{ matrix.task }} \
            -Pkitecodec.ffmpeg.selfContained=true --stacktrace
      - name: Package
        run: bash .github/scripts/package-ffmpeg.sh "${{ github.event.inputs.ffmpeg_version }}" lgpl ${{ matrix.triple }}
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-lgpl-${{ matrix.triple }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  # linux-x64, linux-arm64 and mingw-x64 all cross-build with konan's clang over konan's sysroot
  # (decision W-D3), so one ubuntu job family covers all three. The warmup compile is what
  # downloads that toolchain into ~/.konan/dependencies; it may itself fail (no FFmpeg tree yet,
  # chicken-and-egg), which is fine, the dependencies land before the compiler runs.
  linux-portable:
    name: ${{ matrix.triple }} (lgpl)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        triple: [linux-x64, linux-arm64, mingw-x64]
        include:
          - { triple: linux-x64,   task: LinuxX64 }
          - { triple: linux-arm64, task: LinuxArm64 }
          - { triple: mingw-x64,   task: MingwX64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # nasm assembles FFmpeg's and dav1d's x86 asm; meson/ninja are dav1d's build system.
      # clang is the --host-cc that compiles configure's host-side probe tools.
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm clang meson ninja-build
      - name: Clone FFmpeg ${{ github.event.inputs.ffmpeg_version }}
        run: git clone --depth 1 --branch ${{ github.event.inputs.ffmpeg_version }} https://github.com/FFmpeg/FFmpeg.git vendor/ffmpeg
      - name: Clone dav1d ${{ github.event.inputs.dav1d_version }}
        run: git clone --depth 1 --branch ${{ github.event.inputs.dav1d_version }} https://code.videolan.org/videolan/dav1d.git vendor/dav1d
      - name: Warm the Kotlin/Native toolchain
        run: ./gradlew :kitecodec-core:compileKotlin${{ matrix.task }} --stacktrace || true
      # The bake depends on the dav1d task since KC-EMBED, so one Gradle call builds both
      # (dav1d cross-compiles with the same konan toolchain the warmup just provisioned).
      - name: Build FFmpeg (dav1d inside)
        run: |
          ./gradlew :kitecodec-core:buildFFmpegFor${{ matrix.task }} \
            -Pkitecodec.ffmpeg.selfContained=true --stacktrace
      - name: Package
        run: bash .github/scripts/package-ffmpeg.sh "${{ github.event.inputs.ffmpeg_version }}" lgpl ${{ matrix.triple }}
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-lgpl-${{ matrix.triple }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  # Single point of release creation: downloading every build artifact here and publishing once
  # avoids jobs racing to create/update the same release tag. `if: always()` is deliberate during
  # iteration: publish whatever succeeded, then re-run the failed jobs and this one; softprops
  # updates the existing release, so the missing assets join the same tag. A release only counts
  # as COMPLETE when all 11 zips (one per triple, dav1d inside every one) are present.
  publish:
    name: publish release
    needs: [android, apple, linux-portable]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write      # create/update the release + upload assets
      id-token: write      # OIDC token for provenance attestation
      attestations: write  # store the attestation
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-*
          path: dist
          merge-multiple: true
        continue-on-error: true
      # LGPL source offer: the offer must stay valid for as long as the binaries are distributed,
      # so the exact FFmpeg source is attached to the same release instead of only pointing at a
      # URL we don't control. BUILD-INFO.txt inside each zip references this asset. dav1d is
      # BSD-2-Clause and carries no source obligation; its ref is this workflow's pinned input.
      - name: Fetch FFmpeg source tarball (source offer)
        run: |
          curl -fL --retry 3 \
            -o "dist/ffmpeg-${{ github.event.inputs.ffmpeg_version }}-source.tar.gz" \
            "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/${{ github.event.inputs.ffmpeg_version }}.tar.gz"
          (cd dist && shasum -a 256 "ffmpeg-${{ github.event.inputs.ffmpeg_version }}-source.tar.gz" \
            > "ffmpeg-${{ github.event.inputs.ffmpeg_version }}-source.tar.gz.sha256")
      - name: List release assets
        run: ls -l dist/
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.zip
      - name: Publish to the ${{ github.event.inputs.release_tag }} release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: KiteCodec ${{ github.event.inputs.release_tag }}
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
