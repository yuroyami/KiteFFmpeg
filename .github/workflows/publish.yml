# Publishes kiteffmpeg to Maven Central (Central Portal, via the vanniktech plugin).
# Since 2026-08-22 there is no Gradle plugin: FFmpeg is embedded INSIDE the native
# klibs, so the fetch step below unpacks ALL 11 triples' zips (dav1d inside every one) into
# native-libs/ before publishing, and cinterop embeds them.
#
# ON DEMAND ONLY (owner order 2026-08-22): workflow_dispatch is the single trigger; pushing a
# v-tag no longer publishes anything by itself. The five repository secrets below were set on
# 2026-08-22, so this workflow IS runnable; publishing from the maintainer's machine remains
# equally valid (same credentials in ~/.gradle/gradle.properties):
#   ./gradlew :kiteffmpeg:publishAllPublicationsToMavenCentralRepository --no-configuration-cache \
#     -Pkiteffmpeg.jni.linux=true -Pkiteffmpeg.jni.windows=true
# Either path leaves the deployment staged as USER_MANAGED on the Central Portal; the final
# Publish click stays human.
#
# PREREQUISITES:
#   Secrets (set 2026-08-22):
#     MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD: Central Portal user token
#     SIGNING_IN_MEMORY_KEY / SIGNING_IN_MEMORY_KEY_ID / SIGNING_IN_MEMORY_KEY_PASSWORD:
#       ASCII-armored GPG key, its key id, and the passphrase
#   Release assets:
#     The `v<VERSION>` release (created by release-binaries.yml) must exist with all 11 LGPL
#     zips + .sha256 files: ffmpeg-<ffversion>-lgpl-<triple>.zip for every supported triple.
#
# VERSIONING: the library version is static in gradle.properties (VERSION=…). The tag is the
# trigger, not the source of truth: the check-version job asserts `v<VERSION>` == the pushed tag
# (or the workflow_dispatch input) and fails on mismatch, so a stale gradle.properties can never
# publish under the wrong tag.
#
# kiteffmpeg publishes ALL 11 native targets plus the always-present JVM, JS and WasmJs
# variants. JS/WasmJs are invariant unsupported placeholders. The publish guard in
# kiteffmpeg/build.gradle.kts hard-fails if any configured native target is missing its
# FFmpeg tree, which is why the fetch step must cover all 11.
#
# BILL OF MATERIALS. Before the upload, the run writes an SPDX document of the FFmpeg and dav1d
# that the artifacts embed (scripts/native-sbom.sh), from the archives the fetch step kept, and
# keeps it as the native-sbom-<version> artifact of the run. Attach that file to the GitHub
# release page. A digest, a version or a patch that does not match stops the run before the
# upload. A publish from the maintainer's machine gets no document; run the script by hand there.
name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match VERSION in gradle.properties), e.g. 0.1.0"
        required: true
      release:
        description: "Also press Publish on the Central Portal. Off leaves the deployment staged for a human to finish."
        type: boolean
        default: false

permissions:
  contents: read

env:
  # FFmpeg release whose prebuilt assets kiteffmpeg compiles against and embeds. Keep in
  # sync with BuildFFmpegTask.DEFAULT_SOURCE_REF (buildSrc); the root build asserts they agree.
  FFMPEG_VERSION: n8.1.2
  # The tag the companion zips LIVE on, kept separate from the FFmpeg version they are BUILT from.
  # Both name n8.1.2 today; they are still two settings, because they came apart once and will
  # again. The ffmpeg-n8.0 and ffmpeg-n8.0-r2 releases stay published forever: NOTICE names them as
  # the LGPL source offer for kitecodec-core artifacts already on Maven Central, and Central cannot
  # withdraw a version. What follows is the record of why they parted in 2026-08.
  #
  # because on 2026-08-24 they stopped being the same thing. The aac encoder was missing from the
  # Linux and Windows profiles, so those binaries had to be rebuilt; they went to a NEW tag rather
  # than over ffmpeg-n8.0, because NOTICE names that release as the LGPL source offer for artifacts
  # already published to Maven Central, and Central is immutable. The old tag stays exactly as it
  # was. Asset FILENAMES still carry the FFmpeg version, which is what they are keyed to.
  FFMPEG_ASSET_TAG: ffmpeg-n8.1.2

jobs:
  check-version:
    name: tag matches gradle.properties
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Assert version match
        run: |
          gradle_version="$(grep '^VERSION=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            expected="${{ github.event.inputs.version }}"
          else
            expected="${GITHUB_REF_NAME#v}"
          fi
          if [ "${gradle_version}" != "${expected}" ]; then
            echo "::error::version mismatch: gradle.properties has VERSION=${gradle_version} but the release asked for ${expected}" >&2
            exit 1
          fi
          echo "Publishing version ${gradle_version}"

  publish-library:
    name: kiteffmpeg → Maven Central
    needs: check-version
    # Apple klibs (macosArm64) can only be produced on a macOS host.
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-publish-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-publish-
      # The publish guard requires an FFmpeg tree for EVERY configured target, and cinterop
      # EMBEDS these archives into the published klibs. Fetch this repo's own prebuilt
      # LGPL assets from the release tag being published and unpack into the exact layout
      # FFmpegPaths.resolve() expects: native-libs/<license>/<triple>/{include,lib}. The archives
      # and their .sha256 files stay in build/prebuilt-ffmpeg for the bill of materials.
      - name: Fetch prebuilt FFmpeg (all 11 triples, lgpl, dav1d inside)
        run: |
          set -euo pipefail
          # The FFmpeg binaries are keyed to the FFMPEG version, not to KiteFFmpeg's: n8.0 zips are
          # byte-identical across every KiteFFmpeg release, so ONE canonical `ffmpeg-<version>`
          # release holds them and every KiteFFmpeg version fetches from it. Storing a copy per
          # version release cost 127 MB each for nothing (owner call, 2026-08-22).
          base="https://github.com/${{ github.repository }}/releases/download/${FFMPEG_ASSET_TAG}"
          kept=build/prebuilt-ffmpeg
          mkdir -p "${kept}"
          for triple in macos-arm64 macos-x64 ios-arm64 ios-simulator-arm64 ios-x64 \
                        linux-x64 linux-arm64 mingw-x64 android-arm64 android-arm32 android-x64; do
            asset="ffmpeg-${FFMPEG_VERSION}-lgpl-${triple}.zip"
            echo "fetching ${asset}"
            curl -fL --retry 3 -o "${kept}/${asset}" "${base}/${asset}"
            curl -fL --retry 3 -o "${kept}/${asset}.sha256" "${base}/${asset}.sha256"
            (cd "${kept}" && shasum -a 256 -c "${asset}.sha256")
            mkdir -p "native-libs/lgpl/${triple}"
            unzip -q "${kept}/${asset}" -d "native-libs/lgpl/${triple}"
            test -f "native-libs/lgpl/${triple}/lib/libavformat.a"
          done
      # Written from the archives the step above kept, and before anything is built or uploaded,
      # so a refusal stops the run early.
      - name: Bill of materials for the embedded FFmpeg and dav1d
        run: ./scripts/native-sbom.sh --archives build/prebuilt-ffmpeg
      - name: Keep the bill of materials
        uses: actions/upload-artifact@v4
        with:
          name: native-sbom-${{ inputs.version }}
          path: build/sbom/
          if-no-files-found: error
      # The C helper tasks compile with konan's own LLVM, which only lands in
      # ~/.konan/dependencies once a Kotlin/Native compile has run; on a fresh runner the C task
      # can race it and die with "No LLVM package with a usable clang", measured on this
      # workflow's first armed run. One warmup compile provisions everything.
      - name: Warm the Kotlin/Native toolchain
        run: ./gradlew :kiteffmpeg:compileKotlinMacosArm64 --stacktrace || true
      # The JVM jar carries a JNI library for macOS arm64, Linux x64, Linux arm64 and Windows x64.
      # The last three are cross-linked here with konan's toolchain from the linux-x64, linux-arm64
      # and mingw-x64 trees fetched above; the two switches turn them on, and the build refuses a
      # Maven Central publication without them. The jar is read back before anything is uploaded.
      - name: Link the desktop JNI libraries and check the JVM jar
        run: |
          set -euo pipefail
          ./gradlew :kiteffmpeg:jvmJar -Pkiteffmpeg.jni.linux=true -Pkiteffmpeg.jni.windows=true --stacktrace
          jar="kiteffmpeg/build/libs/kiteffmpeg-jvm-${{ inputs.version }}.jar"
          for lib in macos-arm64/libkitecodec_jni.dylib linux-x64/libkitecodec_jni.so \
                     linux-arm64/libkitecodec_jni.so windows-x64/kitecodec_jni.dll; do
            unzip -l "${jar}" "kiteffmpeg-native/${lib}" > /dev/null \
              || { echo "::error::${jar} carries no kiteffmpeg-native/${lib}" >&2; exit 1; }
          done
      # Uploads to the Central Portal. By default it stops there: the deployment lands as
      # USER_MANAGED and a human presses Publish. With the release input on, the plugin presses it,
      # which is the same click made by the run rather than by a person. Central is immutable
      # either way, so the version gate above is what protects a wrong number, not this switch.
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          # The Android AAR's JNI libraries link with the NDK.
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          task=publishToMavenCentral
          if [ "${{ inputs.release }}" = "true" ]; then task=publishAndReleaseToMavenCentral; fi
          ./gradlew ":kiteffmpeg:$task" \
            -Pkiteffmpeg.jni.linux=true -Pkiteffmpeg.jni.windows=true \
            --no-configuration-cache \
            --stacktrace
