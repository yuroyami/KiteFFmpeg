# Publishes kiteffmpeg, kiteffmpeg-android-natives, kiteffmpeg-web and kiteffmpeg-web-async to Maven
# Central (Central Portal, with the Kotlin Toolchain). Since 2026-08-22 there is no Gradle plugin:
# FFmpeg is embedded INSIDE the native klibs, so the fetch step below unpacks ALL 11 triples' zips
# (dav1d inside every one) into native-libs/ before publishing, and cinterop embeds them.
#
# ON DEMAND ONLY (owner order 2026-08-22): workflow_dispatch is the single trigger; pushing a
# v-tag no longer publishes anything by itself. The repository secrets below were set on
# 2026-08-22, so this workflow IS runnable; publishing from the maintainer's machine remains
# equally valid, with the same credentials in the four KOTLIN_TOOLCHAIN_* variables:
#   ./kotlin publish mavenCentral -m kiteffmpeg -m kiteffmpeg-android-natives -m kiteffmpeg-web -m kiteffmpeg-web-async
# Either path leaves the deployment staged on the Central Portal (publishingMode: manual in
# library.module-template.yaml); the final Publish click stays human.
#
# PREREQUISITES:
#   Secrets (set 2026-08-22):
#     MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD: Central Portal user token
#     SIGNING_IN_MEMORY_KEY / SIGNING_IN_MEMORY_KEY_PASSWORD: ASCII-armored GPG key and its
#       passphrase. The toolchain reads no key id, so SIGNING_IN_MEMORY_KEY_ID is unused.
#   Release assets:
#     The `v<VERSION>` release (created by release-binaries.yml) must exist with all 11 LGPL
#     zips + .sha256 files: ffmpeg-<ffversion>-lgpl-<triple>.zip for every supported triple.
#
# VERSIONING: the library version is static in library.module-template.yaml (publishing.version).
# The tag is the trigger, not the source of truth: the check-version job asserts `v<version>` ==
# the pushed tag (or the workflow_dispatch input) and fails on mismatch, so a stale template can
# never publish under the wrong tag.
#
# kiteffmpeg publishes ALL 11 native targets plus the always-present JVM, JS and WasmJs
# variants. The build of a native target fails when its FFmpeg tree is missing, which is why the
# fetch step must cover all 11.
#
# BILL OF MATERIALS. Before the upload, the run writes an SPDX document of the FFmpeg and dav1d
# that the artifacts embed (scripts/native-sbom.sh), from the archives the fetch step kept, and
# keeps it as the native-sbom-<version> artifact of the run. Attach that file to the GitHub
# release page. A digest, a version or a patch that does not match stops the run before the
# upload. A publish from the maintainer's machine gets no document; run the script by hand there.
#
# TESTS. The upload job waits for the whole of ci.yml, run on the commit being published, so a
# commit whose tests fail cannot reach Central. A release therefore takes as long as CI plus the
# upload, and one flaky test stops it.
name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match publishing.version in library.module-template.yaml), e.g. 0.1.0"
        required: true
      release:
        description: "Also press Publish on the Central Portal. Off leaves the deployment staged for a human to finish."
        type: boolean
        default: false

permissions:
  contents: read

env:
  # FFmpeg release whose prebuilt assets kiteffmpeg compiles against and embeds. Keep in sync
  # with BuildFFmpegTask.DEFAULT_SOURCE_REF; `./kotlin check ffmpegRefs` asserts they agree.
  FFMPEG_VERSION: n9.0.2
  # The tag the companion zips LIVE on, kept separate from the FFmpeg version they are BUILT from.
  # ffmpeg-n9.0.2-r3 holds n9.0.2 built with all fifteen patches, for 0.5.0 and 0.5.1. ffmpeg-n9.0.2-r2 stays
  # as the binaries and source offer of 0.4.0, and ffmpeg-n9.0.2 as those of 0.3.0. The ffmpeg-n8.0 and ffmpeg-n8.0-r2 releases stay published forever: NOTICE names them as
  # the LGPL source offer for kitecodec-core artifacts already on Maven Central, and Central cannot
  # withdraw a version. What follows is the record of why they parted in 2026-08.
  #
  # because on 2026-08-24 they stopped being the same thing. The aac encoder was missing from the
  # Linux and Windows profiles, so those binaries had to be rebuilt; they went to a NEW tag rather
  # than over ffmpeg-n8.0, because NOTICE names that release as the LGPL source offer for artifacts
  # already published to Maven Central, and Central is immutable. The old tag stays exactly as it
  # was. Asset FILENAMES still carry the FFmpeg version, which is what they are keyed to.
  FFMPEG_ASSET_TAG: ffmpeg-n9.0.2-r3
  KOTLIN_CLI_NO_WELCOME_BANNER: 1

jobs:
  check-version:
    name: tag matches the publishing version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Assert version match
        run: |
          # The `version:` line under `publishing:` (the one under `kotlin:` is the Kotlin version).
          library_version="$(awk '/^  publishing:/ { inside = 1; next } /^  [a-z]/ { inside = 0 }
            inside && /^    version:/ { print $2 }' library.module-template.yaml | tr -d '[:space:]')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            expected="${{ github.event.inputs.version }}"
          else
            expected="${GITHUB_REF_NAME#v}"
          fi
          if [ "${library_version}" != "${expected}" ]; then
            echo "::error::version mismatch: library.module-template.yaml has version ${library_version} but the release asked for ${expected}" >&2
            exit 1
          fi
          echo "Publishing version ${library_version}"

  # ci.yml, called on this commit. Its jobs appear in this run under this job's name, and the upload
  # waits for all of them, so a commit whose tests fail cannot reach Central, which cannot withdraw
  # a version. One flaky test therefore stops a release; run it again.
  tests:
    name: CI on the commit being published
    needs: check-version
    uses: ./.github/workflows/ci.yml

  publish-library:
    name: kiteffmpeg, its Android natives and its web jars → Maven Central
    needs: [check-version, tests]
    # Apple klibs (macosArm64) can only be produced on a macOS host.
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # The Kotlin Toolchain downloads (JDK, Kotlin/Native, Node), and konan's LLVM and sysroots.
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            ~/.konan
          key: kotlin-toolchain-publish-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: |
            kotlin-toolchain-publish-
      # The build requires an FFmpeg tree for EVERY native target, and cinterop
      # EMBEDS these archives into the published klibs. Fetch this repo's own prebuilt
      # LGPL assets from the release tag being published and unpack into the exact layout
      # FFmpegPaths.resolve() expects: native-libs/<license>/<triple>/{include,lib}. The archives
      # and their .sha256 files stay in build/prebuilt-ffmpeg for the bill of materials.
      - name: Fetch prebuilt FFmpeg (all 11 triples, lgpl, dav1d inside)
        run: |
          set -euo pipefail
          # The FFmpeg binaries are keyed to the FFMPEG version, not to KiteFFmpeg's: n8.0 zips are
          # byte-identical across every KiteFFmpeg release, so ONE canonical `ffmpeg-<version>`
          # release holds them and every KiteFFmpeg version fetches from it. Storing a copy per
          # version release cost 127 MB each for nothing (owner call, 2026-08-22).
          base="https://github.com/${{ github.repository }}/releases/download/${FFMPEG_ASSET_TAG}"
          kept=build/prebuilt-ffmpeg
          mkdir -p "${kept}"
          for triple in macos-arm64 macos-x64 ios-arm64 ios-simulator-arm64 ios-x64 \
                        linux-x64 linux-arm64 mingw-x64 android-arm64 android-arm32 android-x64; do
            asset="ffmpeg-${FFMPEG_VERSION}-lgpl-${triple}.zip"
            echo "fetching ${asset}"
            curl -fL --retry 3 -o "${kept}/${asset}" "${base}/${asset}"
            curl -fL --retry 3 -o "${kept}/${asset}.sha256" "${base}/${asset}.sha256"
            (cd "${kept}" && shasum -a 256 -c "${asset}.sha256")
            mkdir -p "native-libs/lgpl/${triple}"
            unzip -q "${kept}/${asset}" -d "native-libs/lgpl/${triple}"
            test -f "native-libs/lgpl/${triple}/lib/libavformat.a"
            # Before anything is built: a tree without every committed patch stops the run here,
            # naming what it lacks, instead of at the web jars' bill of materials (#175).
            ./scripts/check-tree-patches.sh "native-libs/lgpl/${triple}"
          done
      # Written from the archives the step above kept, and before anything is built or uploaded,
      # so a refusal stops the run early. It is written again once the web jars exist.
      - name: Bill of materials for the embedded FFmpeg and dav1d
        run: ./scripts/native-sbom.sh --archives build/prebuilt-ffmpeg
      # The JVM jar carries a JNI library for macOS arm64, Linux x64, Linux arm64 and Windows x64.
      # The last three are cross-linked here with konan's toolchain from the linux-x64, linux-arm64
      # and mingw-x64 trees fetched above. The Android natives jar carries one library per ABI,
      # linked with the NDK from the Android trees. Both checks fail while a library is missing,
      # and the JVM jar is read back before anything is uploaded.
      - name: Link the JNI libraries and check the jars
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./kotlin build -m kiteffmpeg -m kiteffmpeg-android-natives -p jvm
          # `do` is a command of the kotlin script here, not the shell keyword.
          # shellcheck disable=SC1010
          ./kotlin do checkDesktopJni && ./kotlin check androidJni
          jar="$(find build/tasks -name 'kiteffmpeg-jvm*.jar' -not -name '*sources*' | head -1)"
          for lib in macos-arm64/libkitecodec_jni.dylib linux-x64/libkitecodec_jni.so \
                     linux-arm64/libkitecodec_jni.so windows-x64/kitecodec_jni.dll; do
            unzip -l "${jar}" "kiteffmpeg-native/${lib}" > /dev/null \
              || { echo "::error::${jar} carries no kiteffmpeg-native/${lib}" >&2; exit 1; }
          done
      # The web codec module, kite.mjs and kite.wasm, links with emscripten against a web FFmpeg
      # built here from the tag being published, with the same patches as the native trees, and
      # goes to the root of the kiteffmpeg-web jar. The two modules whose byte sources may answer
      # later, kite-jspi and kite-asyncify, link from the same tree and go to the root of the
      # kiteffmpeg-web-async jar. Emscripten comes from emsdk at a pinned
      # version, and the FFmpeg clone must be the commit the native archives were built from, so a
      # later publish cannot ship different bytes from the same inputs.
      - name: Build the web codec module
        env:
          EMSCRIPTEN_VERSION: "6.0.11"
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${EMSCRIPTEN_VERSION}" https://github.com/emscripten-core/emsdk.git "${RUNNER_TEMP}/emsdk"
          "${RUNNER_TEMP}/emsdk/emsdk" install "${EMSCRIPTEN_VERSION}"
          "${RUNNER_TEMP}/emsdk/emsdk" activate "${EMSCRIPTEN_VERSION}"
          source "${RUNNER_TEMP}/emsdk/emsdk_env.sh"
          git clone --depth 1 --branch "${FFMPEG_VERSION}" https://github.com/FFmpeg/FFmpeg.git vendor/ffmpeg
          expected=$(unzip -p "build/prebuilt-ffmpeg/ffmpeg-${FFMPEG_VERSION}-lgpl-macos-arm64.zip" BUILD-INFO.txt \
            | sed -n 's/^Git commit: *//p' | head -1 | tr -d '\r')
          actual=$(git -C vendor/ffmpeg rev-parse HEAD)
          if [ -z "${expected}" ] || [ "${actual}" != "${expected}" ]; then
            echo "::error::FFmpeg ${FFMPEG_VERSION} cloned as ${actual}, but the native archives were built from ${expected}" >&2
            exit 1
          fi
          export KITEFFMPEG_EMSCRIPTEN_LLVM_BIN="${EMSDK}/upstream/bin"
          # shellcheck disable=SC1010
          ./kotlin build -m kiteffmpeg-web -m kiteffmpeg-web-async
          ./kotlin check webPackage
          # Copies under the published file names, for the bill of materials.
          mkdir -p build/web-jars
          web="build/web-jars/kiteffmpeg-web-${{ inputs.version }}.jar"
          web_async="build/web-jars/kiteffmpeg-web-async-${{ inputs.version }}.jar"
          cp build/tasks/_kiteffmpeg-web_jarJvm/kiteffmpeg-web-jvm.jar "${web}"
          cp build/tasks/_kiteffmpeg-web-async_jarJvm/kiteffmpeg-web-async-jvm.jar "${web_async}"
          for entry in kite.mjs kite.wasm build-info/web-build-info.txt build-info/ffmpeg-patches.txt \
                       licenses/COPYING.LGPLv2.1 licenses/THIRD-PARTY.txt; do
            unzip -l "${web}" "${entry}" > /dev/null \
              || { echo "::error::the kiteffmpeg-web jar carries no ${entry}" >&2; exit 1; }
          done
          for entry in kite-jspi.mjs kite-jspi.wasm kite-asyncify.mjs kite-asyncify.wasm \
                       build-info/web-build-info.txt build-info/ffmpeg-patches.txt; do
            unzip -l "${web_async}" "${entry}" > /dev/null \
              || { echo "::error::the kiteffmpeg-web-async jar carries no ${entry}" >&2; exit 1; }
          done
      # Now with the web jars: their digests, FFmpeg commit and patches, and emscripten version.
      # A jar is a zip file, so the script reads it through --web-zip.
      - name: Bill of materials for the embedded code, with the web jars
        run: |
          ./scripts/native-sbom.sh --archives build/prebuilt-ffmpeg \
            --web-zip "build/web-jars/kiteffmpeg-web-${{ inputs.version }}.jar" \
            --web-zip "build/web-jars/kiteffmpeg-web-async-${{ inputs.version }}.jar"
      - name: Keep the bill of materials
        uses: actions/upload-artifact@v4
        with:
          name: native-sbom-${{ inputs.version }}
          path: build/sbom/
          if-no-files-found: error
      # Uploads to the Central Portal. By default it stops there: the deployment waits and a human
      # presses Publish. With the release input on, the run switches publishingMode to auto in its
      # own checkout, which is the same click made by the run rather than by a person. Central is
      # immutable either way, so the version gate above is what protects a wrong number, not this
      # switch.
      - name: Publish to Maven Central
        env:
          KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY_PASSPHRASE: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          # The Android natives jar links with the NDK. The web jars link with emscripten if
          # their earlier link is out of date.
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          source "${RUNNER_TEMP}/emsdk/emsdk_env.sh"
          export KITEFFMPEG_EMSCRIPTEN_LLVM_BIN="${EMSDK}/upstream/bin"
          if [ "${{ inputs.release }}" = "true" ]; then
            sed -i '' 's/publishingMode: manual/publishingMode: auto/' library.module-template.yaml
            grep -q 'publishingMode: auto' library.module-template.yaml
          fi
          ./kotlin publish mavenCentral -m kiteffmpeg -m kiteffmpeg-android-natives -m kiteffmpeg-web -m kiteffmpeg-web-async
