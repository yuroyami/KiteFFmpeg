# Builds + tests kiteffmpeg and runs an end-to-end transcode on every desktop Kotlin/Native target
# that can get an FFmpeg tree in CI. The build uses the Kotlin Toolchain (`./kotlin`), which downloads
# its own JDK, Kotlin/Native and Node, so no job sets up Java or Gradle.
#
#   - macOS arm64  → the VENDORED LGPL profile, built from source. This job carries the ratchets
#                    (public API, cinterop coupling, klib metadata, deleted surface). The vendored
#                    tree is pinned at n9.0.2 by the build, so the frozen metadata constants describe
#                    the FFmpeg the project actually ships.
#   - Linux x64    → the prebuilt static tree from this repo's own companion release. A distro
#                    FFmpeg cannot work: Ubuntu's libav* .so files need glibc 2.29/2.34, while
#                    Kotlin/Native links its own 2.19 sysroot, so ld.lld refuses.
#   - Windows x64  → the prebuilt static mingw-x64 tree from the same release.
#   - macOS arm64  → the same VENDORED LGPL profile again, in the vendored-lgpl job, which runs the
#                    full suite and e2e against it. It is the only job that can catch the suite
#                    depending on codecs, muxers or protocols the released artifact does not contain.
#
# Android NDK targets get compile checks: each ABI builds its (self-contained, cached) LGPL
# FFmpeg and compiles the klib.
#
# Not covered (yet): no job runs the tests of iosArm64, iosSimulatorArm64, iosX64, linuxArm64 or
# macosX64. The ratchets job compiles their klibs for the public API check, which is a compile
# claim only. linuxArm64 needs an arm64 runner with Kotlin/Native host support.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # The publish workflow runs this whole file on the commit it is about to publish.
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when the publish workflow calls this file, so a release
  # run and a push run on the same branch never cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: 1
  # The FFmpeg version the PREBUILT ZIPS were built from; asset filenames carry it. This is NOT the
  # version this repository builds from source, and the two may differ: jobs that clone FFmpeg pin
  # it in their own `git clone --branch`, and `./kotlin check ffmpegRefs` compares those clones with
  # the build recipe. This line moves only when a new companion release is published.
  FFMPEG_VERSION: n9.0.2
  # The tag the companion zips LIVE on, kept separate from the FFmpeg version they are BUILT from.
  # ffmpeg-n9.0.2-r3 holds n9.0.2 built with all fifteen patches, for 0.5.0 and 0.5.1. ffmpeg-n9.0.2-r2
  # stays as the binaries and source offer of 0.4.0, and ffmpeg-n9.0.2 as those of 0.3.0. The
  # ffmpeg-n8.0 and ffmpeg-n8.0-r2 releases stay published forever: NOTICE names them as the LGPL
  # source offer for kitecodec-core artifacts already on Maven Central, and Central cannot withdraw a
  # version. Asset FILENAMES carry the FFmpeg version, which is what they are keyed to.
  FFMPEG_ASSET_TAG: ffmpeg-n9.0.2-r3

jobs:
  macos-arm64:
    name: macOS arm64 (vendored LGPL FFmpeg, the ratchets)
    runs-on: macos-latest
    # Sized for a cold-cache build of the vendored tree from source. Matches the vendored-lgpl job.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # The Kotlin Toolchain keeps its JDK, Kotlin/Native and Node in the first folder. Kotlin/Native
      # keeps its LLVM and per-target sysroots in ~/.konan.
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            ~/.konan
          key: kotlin-toolchain-macos-arm64-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: |
            kotlin-toolchain-macos-arm64-
      # THE VENDORED TREE, not Homebrew. klib-metadata-baseline.txt freezes 24 FFmpeg version
      # constants down to their micro values, and a pin against the moving Homebrew formula is a
      # calendar, not a gate. The vendored LGPL tree is pinned at n9.0.2 by the build, and the
      # committed baseline matches it with zero drift. FFmpegPaths prefers native-libs/ over any
      # system install, so building the tree is selecting it.
      #
      # Same cache key as the vendored-lgpl job, so whichever runs first pays for the build and the
      # other restores it.
      #
      # Every FFmpeg cache key in this file carries the source patches as well as the build recipes,
      # because the build applies them and the recipe check never reads them.
      - name: Install build deps + the ffmpeg CLI (for e2e assertions only)
        run: brew install nasm meson ninja svt-av1 aom libvpx opus lame webp freetype harfbuzz fribidi libass ffmpeg jq
      - name: Cache the vendored FFmpeg and dav1d builds
        id: ffmpeg-vendored
        uses: actions/cache@v4
        with:
          path: |
            native-libs/lgpl/macos-arm64
            native-libs/deps/macos-arm64
          key: ffmpeg-macos-arm64-lgpl-n9.0.2-${{ hashFiles('build-plugins/native-build/src/BuildFFmpegTask.kt', 'build-plugins/native-build/src/BuildDav1dTask.kt', 'native/patches/ffmpeg/*.patch') }}
      - name: Build the vendored LGPL FFmpeg from source
        if: steps.ffmpeg-vendored.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch n9.0.2 https://github.com/FFmpeg/FFmpeg.git vendor/ffmpeg
          git clone --depth 1 --branch 1.5.4 https://code.videolan.org/videolan/dav1d vendor/dav1d
          # shellcheck disable=SC1010
          ./kotlin do buildFFmpegForMacosArm64
      # The ratchets below read this tree. If it is missing they would silently fall back to the
      # brew install above.
      - name: Confirm the ratchets will read the vendored tree
        run: test -f native-libs/lgpl/macos-arm64/lib/libavformat.a
      # The public API check reads the klib of every native platform, so each one needs an FFmpeg
      # tree. The other ten come from this repository's prebuilt release, checksum verified, as in
      # publish.yml. macos-arm64 is not fetched: this job built it above, and the ratchets read it.
      - name: Fetch the prebuilt static FFmpeg for the other ten native targets
        run: |
          set -euo pipefail
          base="https://github.com/${{ github.repository }}/releases/download/${FFMPEG_ASSET_TAG}"
          for triple in macos-x64 ios-arm64 ios-simulator-arm64 ios-x64 \
                        linux-x64 linux-arm64 mingw-x64 android-arm64 android-arm32 android-x64; do
            asset="ffmpeg-${FFMPEG_VERSION}-lgpl-${triple}.zip"
            curl -fL --retry 3 -o "${asset}" "${base}/${asset}"
            curl -fL --retry 3 -o "${asset}.sha256" "${base}/${asset}.sha256"
            shasum -a 256 -c "${asset}.sha256"
            mkdir -p "native-libs/lgpl/${triple}"
            unzip -q "${asset}" -d "native-libs/lgpl/${triple}"
            test -f "native-libs/lgpl/${triple}/lib/libavformat.a"
            # The release does not move when a patch is added, so a stale tree fails here (#175).
            ./scripts/check-tree-patches.sh "native-libs/lgpl/${triple}"
            rm -f "${asset}" "${asset}.sha256"
          done
      # The ratchets.
      # - `./kotlin build -m kiteffmpeg` compiles every platform and every shared native folder
      #   (src@native, src@apple and the others). A publish compiles them too, and the 0.3.0 publish
      #   once failed there, before any upload.
      # - abi and klibAbi compare the JVM and klib API with the committed dumps in kiteffmpeg/api, so
      #   a public API change fails here instead of shipping. Re-dump with `./kotlin do updateAbi`
      #   and `./kotlin do updateKlibAbi` after a full build.
      # - cinteropCoupling recounts the Kotlin-to-FFmpeg coupling and fails when it grew.
      # - wasmBindingMirror regenerates the web binding in memory from signature-baseline.txt and
      #   compares it with the committed copy that compiles.
      # - releaseTargetMirror fails when release-binaries.yml forgets a target of the TargetTriple enum.
      # - jniRegistration and ffmpegRefs check the JNI registration table and the FFmpeg release pins.
      # check-deleted-surface.sh holds the fifteen deleted ffkmp_ names dead. It needs no build output.
      - name: Public API baseline + coupling + deleted surface + wasm mirror + dependency hygiene
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          ./kotlin build -m kiteffmpeg
          ./kotlin check abi klibAbi cinteropCoupling wasmBindingMirror releaseTargetMirror jniRegistration ffmpegRefs
          ./native/kitecodec-c/scripts/check-deleted-surface.sh
          ./native/kitecodec-jni/scripts/source-discipline.sh
          ./scripts/check-dependency-hygiene.sh
      # The third ratchet, and the only guard on the cinterop klib: the klib API check covers
      # kiteffmpeg's own klib, and the cinterop klib holds every FFmpeg binding and every ffkmp_
      # helper. klib-metadata-diff.sh --check dumps its metadata and fails when it differs from the
      # committed baseline. Deliberate changes re-baseline with --update in the same commit.
      #
      # The archive listing prints what the C helper compile built, per target, so the log says which
      # targets got one. `file` on an ar archive names the format and not the architecture, so the
      # objects are listed too.
      - name: Cinterop metadata baseline + the C archives that were built
        run: |
          ./native/kitecodec-c/scripts/klib-metadata-diff.sh --check
          find build/tasks -path '*_kiteffmpeg_ffmpegInterop*' -name libkitecodec.a | sort | while read -r archive; do
            echo "$archive: $(file -b "$archive")"
          done
          find build/tasks -path '*_kiteffmpeg_ffmpegInterop*' -path '*/obj/*' -name '*.o' | sort | while read -r object; do
            echo "$object: $(file -b "$object")"
          done
      # The macOS tests write the codec-contract transcript that the comparison below reads.
      - name: Unit + native tests
        run: KITECODEC_CONTRACT_TRANSCRIPT="$PWD/build/contract-transcripts/macosArm64.txt" ./kotlin test -m kiteffmpeg -p macosArm64
      # The JVM tests include the JNI boundary harness. Then the JVM and macOS codec-contract
      # transcripts must agree byte for byte.
      - name: JNI boundary tests + JVM and native contract comparison
        run: |
          ./kotlin test -m kiteffmpeg -p jvm
          # shellcheck disable=SC1010
          ./kotlin do compareCodecContract
      # The tests of the build plugins. They cover the coupling ratchet and the C compile task,
      # including its wrong-architecture refusal.
      - name: Build-logic tests
        run: ./kotlin test -m native-build
      - name: Link sample
        run: ./kotlin build -m kiteffmpeg-sample-macos -p macosArm64
      - name: End-to-end transcode
        run: scripts/e2e.sh "$(find build/tasks -name 'kiteffmpeg-sample-macos.kexe' -type f | head -1)"
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-macos-arm64
          path: |
            build/reports/**
            build/test-results/**
          retention-days: 7
          if-no-files-found: ignore

  ffmpeg-identity-gate:
    # Deliberately its own job and not steps inside macos-arm64, so that this block can be moved,
    # reordered or merged without touching another job.
    name: Host C suites and the FFmpeg identity gate
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            ~/.konan
          key: kotlin-toolchain-identity-gate-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: |
            kotlin-toolchain-identity-gate-
      - name: Install FFmpeg
        run: brew install ffmpeg
      # ALL EIGHT suites. Passing no suite name runs the whole list, which is what run-c-tests.sh
      # documents as gate behaviour.
      #
      # test_identity is the reason this job is separate: it compiles src/kitecodec_abi.c five more
      # times against the doctored header trees under tests/fake_headers/ and asserts one case per
      # verdict, including the TRUE build, which is the case that fails if the policy is too strict.
      # It also asserts that the diagnostic bypass is not a silent default, that it works when set,
      # and that its warning is printed exactly once per process.
      #
      # ASan catches an out-of-bounds read through a struct field offset that moved. Plain compiles
      # the doctored objects at -O2, so a shim that only worked at -O1 fails. Both are needed.
      - name: Host C suites under ASan
        working-directory: native/kitecodec-c
        run: |
          ./scripts/build-host.sh asan
          ./scripts/run-c-tests.sh asan
      - name: Host C suites plain
        working-directory: native/kitecodec-c
        run: |
          ./scripts/build-host.sh plain
          ./scripts/run-c-tests.sh plain
      # The six kc_ functions must be exported and nothing else new must be, the identity gate's
      # undefined symbols must all be on the measured allowlist, and it must be the ONLY unit in the
      # library that writes to a stream: that permission exists for the bypass warning alone.
      - name: Symbol audit of the host archive
        working-directory: native/kitecodec-c
        run: ./scripts/symbol-audit.sh --host
      # The Kotlin end of the gate: the report crossing into Kotlin with both version columns, the
      # typed FFmpegError a consumer can catch, and the entry points letting a healthy runtime
      # through. With no vendored tree, the build links the Homebrew FFmpeg installed above. Then
      # the tests of the build plugins, which include the FFmpeg release pin checks.
      - name: Kotlin surface and build-side checks
        run: |
          ./kotlin test -m kiteffmpeg -p macosArm64 --include-classes='*FFmpegIdentityTest'
          ./kotlin test -m native-build
      # The web backend. The tests drive it through a FAKE emscripten module, which works because
      # every generated external takes the codec module as its first argument. So this path needs
      # no FFmpeg, no Kotlin/Native and no web codec module.
      #
      # Node and headless Chrome. `./kotlin test` cannot run JS tests, and its Chrome page cannot
      # reach the codec modules, so scripts/web-tests/run.py links the tests with the toolchain and
      # runs them. The JS tests run here too.
      - name: Web backend tests (js and wasmJs, node and browser)
        run: python3 scripts/web-tests/run.py --platform js --platform wasmJs --platform wasmJsBrowser
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-ffmpeg-identity-gate
          path: |
            build/reports/**
            build/test-results/**
          retention-days: 7
          if-no-files-found: ignore

  # The web backend against the codec module it ships with. The identity gate runs the web tests
  # against a fake module; this job links the real one, from a web FFmpeg built here, and runs the
  # same tests. --require-modules makes the decode contract fail instead of skip when the module is
  # missing, so this job cannot pass without decoding real media.
  web-codec-module:
    name: Web backend against the linked codec module (node and browser)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            ~/.konan
          key: kotlin-toolchain-web-codec-module-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: |
            kotlin-toolchain-web-codec-module-
      - name: Install emscripten
        id: emscripten
        run: |
          brew install emscripten
          echo "version=$(emcc --version | head -1 | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
      # A web FFmpeg is only as good as the compiler that built it, so the key carries the emcc
      # version as well as the build recipe, the source patches and the FFmpeg tag.
      - name: Cache the web FFmpeg build
        id: ffmpeg-web
        uses: actions/cache@v4
        with:
          path: native-libs/lgpl/wasm32
          key: ffmpeg-wasm32-lgpl-n9.0.2-emcc-${{ steps.emscripten.outputs.version }}-${{ hashFiles('build-plugins/native-build/src/BuildFFmpegWasmTask.kt', 'native/patches/ffmpeg/*.patch') }}
      - name: Build the web FFmpeg from source
        if: steps.ffmpeg-web.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch n9.0.2 https://github.com/FFmpeg/FFmpeg.git vendor/ffmpeg
          # shellcheck disable=SC1010
          ./kotlin do buildFFmpegForWasm
      # The bake skips itself when the restored tree is complete, so this links the module only.
      - name: Link the codec module
        run: |
          # shellcheck disable=SC1010
          ./kotlin do linkKiteFFmpegWasmModule
      # JSPI needs a recent engine, and the runner's own Node may be older.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Check the asynchronous codec modules (node)
        run: |
          # shellcheck disable=SC1010
          ./kotlin do checkKiteFFmpegAsyncWasmModules
      - name: Web tests against the linked module (node)
        run: python3 scripts/web-tests/run.py --platform wasmJs --require-modules
      # The same tests in a page of headless Chrome, which loads the modules over HTTP as a site
      # does. scripts/web-tests/browser.mjs serves them.
      - name: Web tests against the linked module (headless browser)
        run: python3 scripts/web-tests/run.py --platform wasmJsBrowser --require-modules
      # The asynchronous runtime in a Web Worker: a second wasm binary reads a real HLS stream on
      # both modules, and the page checks what it posts.
      - name: Asynchronous runtime in a Web Worker (headless browser)
        run: python3 scripts/web-tests/run.py --platform worker --require-modules
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-web-codec-module
          path: |
            build/reports/**
            build/test-results/**
          retention-days: 7
          if-no-files-found: ignore

  linux-x64:
    name: Linux x64 (prebuilt static FFmpeg, the shipped profile)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.konan
          key: kotlin-toolchain-linux-x64-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: |
            kotlin-toolchain-linux-x64-
      # NOT apt. Ubuntu 24.04's libav* .so files reference glibc 2.29 and 2.34 symbols, while
      # Kotlin/Native links against its own glibc 2.19 sysroot, so ld.lld refuses with
      # `undefined reference: exp@GLIBC_2.29 ... referenced by libswscale.so`.
      #
      # So this job reads the same prebuilt STATIC tree the published artifact is built from,
      # fetched from this repository's own companion release and checksum-verified.
      #
      # The ffmpeg CLI still comes from apt, for scripts/e2e.sh's assertions only. It is not what
      # gets linked.
      - name: Fetch the prebuilt static FFmpeg (linux-x64) + the ffmpeg CLI for e2e
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq
          base="https://github.com/${{ github.repository }}/releases/download/${FFMPEG_ASSET_TAG}"
          asset="ffmpeg-${FFMPEG_VERSION}-lgpl-linux-x64.zip"
          curl -fL --retry 3 -o "${asset}" "${base}/${asset}"
          curl -fL --retry 3 -o "${asset}.sha256" "${base}/${asset}.sha256"
          shasum -a 256 -c "${asset}.sha256"
          mkdir -p native-libs/lgpl/linux-x64
          unzip -q "${asset}" -d native-libs/lgpl/linux-x64
          test -f native-libs/lgpl/linux-x64/lib/libavformat.a
          ./scripts/check-tree-patches.sh native-libs/lgpl/linux-x64
          rm -f "${asset}" "${asset}.sha256"
      - name: Unit + native tests
        run: ./kotlin test -m kiteffmpeg -p linuxX64
      - name: Link sample
        run: ./kotlin build -m kiteffmpeg-sample-linux -p linuxX64
      - name: End-to-end transcode
        run: scripts/e2e.sh "$(find build/tasks -name 'kiteffmpeg-sample-linux.kexe' -type f | head -1)"
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-linux-x64
          path: |
            build/reports/**
            build/test-results/**
          retention-days: 7
          if-no-files-found: ignore

  replay-corpus:
    # The committed corpus replayed under ASan and UBSan. This is a REGRESSION TEST, not a fuzz
    # run: it takes a couple of minutes and it belongs on every push. The 30-minute fuzzer that
    # GROWS the corpus is in fuzz.yml.
    name: Replay the committed corpus (ASan + UBSan, ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install clang, the sanitizer runtime and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-rt-18-dev pkg-config \
            libavformat-dev libavcodec-dev libavfilter-dev \
            libavutil-dev libswscale-dev libswresample-dev
      - name: Replay the committed corpus under ASan and UBSan
        env:
          KC_CC: clang-18
        run: |
          set -euo pipefail
          cd native/kitecodec-c
          mkdir -p build/asan/lib build/asan/obj
          FF_CFLAGS="$(pkg-config --cflags libavformat libavcodec libavfilter libavutil libswscale libswresample)"
          for source in src/*.c; do
            # FF_CFLAGS is a list of -I flags and must word split.
            # shellcheck disable=SC2086
            clang-18 -std=c11 -Wall -Wextra -Werror -Werror=vla -g \
              -fsanitize=address,undefined -fno-omit-frame-pointer -O1 \
              $FF_CFLAGS -I include -fvisibility=hidden \
              -c "$source" -o "build/asan/obj/$(basename "${source%.c}").o"
          done
          ar rcs build/asan/lib/libkitecodec_helpers_host.a build/asan/obj/*.o
          ./scripts/replay-corpus.sh asan

  # THE job that keeps the library honest about what it ships.
  #
  # The identity gate links the runner's brew FFmpeg, a full GPL build with every codec compiled in.
  # What users actually get is the vendored LGPL profile of the FFmpeg bake: no libx264, a
  # deliberately small codec/muxer/protocol set. Testing only against the system build means the
  # test suite and the sample can drift into depending on codecs the shipped artifact does not
  # contain, and nothing notices. So: build the real profile from source, put it under native-libs/
  # (where FFmpegPaths prefers it over any system install), and run the whole suite against that:
  # unit tests, native tests, and the full e2e.
  vendored-lgpl:
    name: macOS arm64 (vendored LGPL FFmpeg, the shipped profile)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            ~/.konan
          key: kotlin-toolchain-vendored-lgpl-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: |
            kotlin-toolchain-vendored-lgpl-
      # The desktop LGPL profile links these; several (lame above all) ship no pkg-config file,
      # which is why the FFmpeg bake passes an explicit -I/-L for the Homebrew prefix.
      # `ffmpeg` itself is for scripts/e2e.sh's CLI generation + ffprobe assertions only. KiteFFmpeg
      # links the vendored tree, not this one. meson and ninja are for dav1d, which the FFmpeg build
      # needs.
      - name: Install build deps + the ffmpeg CLI (for e2e assertions)
        run: brew install nasm meson ninja svt-av1 aom libvpx opus lame webp freetype harfbuzz fribidi libass ffmpeg jq
      # BOTH output trees: the FFmpeg build depends on a dav1d build, and dav1d installs to
      # native-libs/deps/<triple>/dav1d, NOT under native-libs/lgpl/. The key hashes both recipes, so
      # a change to either invalidates both trees together.
      - name: Cache the vendored FFmpeg and dav1d builds
        id: ffmpeg-vendored
        uses: actions/cache@v4
        with:
          path: |
            native-libs/lgpl/macos-arm64
            native-libs/deps/macos-arm64
          key: ffmpeg-macos-arm64-lgpl-n9.0.2-${{ hashFiles('build-plugins/native-build/src/BuildFFmpegTask.kt', 'build-plugins/native-build/src/BuildDav1dTask.kt', 'native/patches/ffmpeg/*.patch') }}
      - name: Build the vendored LGPL FFmpeg from source
        if: steps.ffmpeg-vendored.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch n9.0.2 https://github.com/FFmpeg/FFmpeg.git vendor/ffmpeg
          git clone --depth 1 --branch 1.5.4 https://code.videolan.org/videolan/dav1d vendor/dav1d
          # shellcheck disable=SC1010
          ./kotlin do buildFFmpegForMacosArm64
      - name: Confirm the vendored tree is what gets linked
        run: test -f native-libs/lgpl/macos-arm64/lib/libavformat.a
      # No KITEFFMPEG_FFMPEG_LICENSE=gpl anywhere below: LGPL is the shipping default.
      - name: Unit + native tests against the vendored build
        run: ./kotlin test -m kiteffmpeg -p macosArm64
      # The JVM backend runs the JNI adapter over the same vendored tree: the shared contract suite,
      # the byte-source and close-race tests and the dispatch tests.
      - name: JVM tests against the vendored build
        run: ./kotlin test -m kiteffmpeg -p jvm
      - name: Link sample
        run: ./kotlin build -m kiteffmpeg-sample-macos -p macosArm64
      - name: End-to-end transcode against the vendored build
        run: scripts/e2e.sh "$(find build/tasks -name 'kiteffmpeg-sample-macos.kexe' -type f | head -1)"
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-vendored-lgpl
          path: |
            build/reports/**
            build/test-results/**
          retention-days: 7
          if-no-files-found: ignore

  android:
    name: Android ${{ matrix.abi }} (NDK FFmpeg, LGPL profile)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: arm64, triple: android-arm64, task: AndroidArm64, platform: androidNativeArm64 }
          - { abi: arm32, triple: android-arm32, task: AndroidArm32, platform: androidNativeArm32 }
          - { abi: x64,   triple: android-x64,   task: AndroidX64,   platform: androidNativeX64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.konan
          key: kotlin-toolchain-android-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: |
            kotlin-toolchain-android-
      # The NDK cross-compile of FFmpeg takes ~6 min per ABI, so cache the resulting static libs
      # and only rebuild when the build recipes (codec set, flags) or the patches change.
      # Both trees and both sources: dav1d installs to native-libs/deps/<triple>/dav1d.
      - uses: actions/cache@v4
        id: ffmpeg-android
        with:
          path: |
            native-libs/lgpl/${{ matrix.triple }}
            native-libs/deps/${{ matrix.triple }}
          key: ffmpeg-${{ matrix.triple }}-lgpl-n9.0.2-api24-${{ hashFiles('build-plugins/native-build/src/BuildFFmpegTask.kt', 'build-plugins/native-build/src/BuildDav1dTask.kt', 'native/patches/ffmpeg/*.patch') }}
      - name: Install the dav1d build tools
        if: steps.ffmpeg-android.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build nasm
      - name: Build FFmpeg and dav1d for Android (NDK)
        if: steps.ffmpeg-android.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch n9.0.2 https://github.com/FFmpeg/FFmpeg.git vendor/ffmpeg
          git clone --depth 1 --branch 1.5.4 https://code.videolan.org/videolan/dav1d vendor/dav1d
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          # shellcheck disable=SC1010
          ./kotlin do buildFFmpegFor${{ matrix.task }}
      - name: Compile kiteffmpeg klib (${{ matrix.platform }})
        run: ./kotlin build -m kiteffmpeg -p ${{ matrix.platform }}
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-android-${{ matrix.abi }}
          path: |
            build/reports/**
            build/test-results/**
          retention-days: 7
          if-no-files-found: ignore

  # Consumer end-to-end smoke: publishes kiteffmpeg to mavenLocal from this checkout, generates a
  # throwaway Gradle consumer project, and builds + RUNS a real executable that calls into FFmpeg.
  # This proves the full consumer chain end to end: resolution from mavenLocal, klib + bundled
  # cinterop compile, final native link, and runtime symbol resolution.
  #
  # This is a ONE-DEPENDENCY-LINE smoke: no plugin and no FFmpeg source selection. FFmpeg rides
  # inside the klib. The consumer stays a Gradle project, because that is what most consumers write.
  consumer-e2e:
    name: Consumer e2e smoke (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-arm64
            target: macosArm64
            taskSuffix: MacosArm64
            toolchainCache: ~/Library/Caches/JetBrains/Kotlin
            triples: macos-arm64 macos-x64 ios-arm64 ios-simulator-arm64 ios-x64 linux-x64 linux-arm64 mingw-x64 android-arm64 android-arm32 android-x64
          - os: ubuntu-24.04
            label: linux-x64
            target: linuxX64
            taskSuffix: LinuxX64
            toolchainCache: ~/.cache/JetBrains/Kotlin
            triples: linux-x64 linux-arm64 mingw-x64 android-arm64 android-arm32 android-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.toolchainCache }}
            ~/.konan
          key: kotlin-toolchain-consumer-${{ matrix.label }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: |
            kotlin-toolchain-consumer-${{ matrix.label }}-
      # THE PREBUILT STATIC TREES, and this is the whole validity of the job. A system, dynamic
      # FFmpeg would give a klib that does not embed FFmpeg, and the generated consumer would then
      # fail to link with `ld: library 'avformat' not found`. The prebuilt static trees make the klib
      # self-contained, which is what a consumer actually gets from Maven Central.
      #
      # A toolchain publish builds every platform that the host can build, so the job fetches the
      # tree of each of them. A Linux runner cannot build the Apple platforms.
      - name: Fetch the prebuilt static FFmpeg trees
        run: |
          set -euo pipefail
          base="https://github.com/${{ github.repository }}/releases/download/${FFMPEG_ASSET_TAG}"
          for triple in ${{ matrix.triples }}; do
            asset="ffmpeg-${FFMPEG_VERSION}-lgpl-${triple}.zip"
            curl -fL --retry 3 -o "${asset}" "${base}/${asset}"
            curl -fL --retry 3 -o "${asset}.sha256" "${base}/${asset}.sha256"
            shasum -a 256 -c "${asset}.sha256"
            mkdir -p "native-libs/lgpl/${triple}"
            unzip -q "${asset}" -d "native-libs/lgpl/${triple}"
            test -f "native-libs/lgpl/${triple}/lib/libavformat.a"
            ./scripts/check-tree-patches.sh "native-libs/lgpl/${triple}"
            rm -f "${asset}" "${asset}.sha256"
          done
      - name: Publish the library to mavenLocal
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          # The toolchain signs a mavenLocal publish too. This job has no release key, so it uses a throwaway one.
          . scripts/test-signing-key.sh
          ./kotlin publish mavenLocal -m kiteffmpeg -m kiteffmpeg-android-natives
      # The consumer is a Gradle project, so this job installs Gradle for it. The library build
      # itself does not use Gradle.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: 9.8.1
      - name: Generate throwaway consumer project
        run: |
          set -euo pipefail
          # The publishing version and the Kotlin version are the `version:` lines of the two blocks.
          VERSION="$(awk '/^  publishing:/ { p = 1 } p && /^    version:/ { print $2; exit }' library.module-template.yaml)"
          KOTLIN_VERSION="$(awk '/^  kotlin:/ { p = 1 } p && /^    version:/ { print $2; exit }' library.module-template.yaml)"
          consumer="$RUNNER_TEMP/kiteffmpeg-smoke"
          mkdir -p "$consumer/src/commonMain/kotlin"
          cat > "$consumer/settings.gradle.kts" <<EOF
          pluginManagement {
              repositories {
                  mavenLocal()
                  mavenCentral()
                  gradlePluginPortal()
                  google()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  mavenLocal()
                  mavenCentral()
                  google()
              }
          }
          rootProject.name = "kiteffmpeg-smoke"
          EOF
          cat > "$consumer/build.gradle.kts" <<EOF
          // ONE DEPENDENCY LINE, and no plugin. That is what a real consumer writes, and it is also
          // the product claim: add the dependency, get a working FFmpeg.
          plugins {
              id("org.jetbrains.kotlin.multiplatform") version "$KOTLIN_VERSION"
          }

          kotlin {
              ${{ matrix.target }} {
                  binaries.executable {
                      entryPoint = "main"
                  }
              }
              sourceSets {
                  commonMain.dependencies {
                      implementation("io.github.yuroyami:kiteffmpeg:$VERSION")
                  }
              }
          }
          EOF
          cat > "$consumer/src/commonMain/kotlin/Main.kt" <<'EOF'
          import io.github.yuroyami.kiteffmpeg.FFmpeg

          fun main() {
              // Touches real FFmpeg symbols at runtime, which proves the cinterop klib linked and loads.
              println("KITECODEC_SMOKE avutil=${FFmpeg.versions.avutil} avcodec=${FFmpeg.versions.avcodec}")
          }
          EOF
      - name: Build consumer executable
        run: gradle -p "$RUNNER_TEMP/kiteffmpeg-smoke" linkDebugExecutable${{ matrix.taskSuffix }} --stacktrace
      - name: Run consumer executable
        run: |
          set -euo pipefail
          out="$("$RUNNER_TEMP/kiteffmpeg-smoke/build/bin/${{ matrix.target }}/debugExecutable/kiteffmpeg-smoke.kexe")"
          echo "$out"
          echo "$out" | grep -q "KITECODEC_SMOKE avutil="
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-consumer-e2e-${{ matrix.label }}
          path: |
            build/reports/**
            ${{ runner.temp }}/kiteffmpeg-smoke/build/reports/**
          retention-days: 7
          if-no-files-found: ignore

  windows-x64:
    name: Windows x64 (prebuilt static FFmpeg, the shipped profile)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/JetBrains/Kotlin
            ~/.konan
          key: kotlin-toolchain-windows-x64-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: |
            kotlin-toolchain-windows-x64-
      # This project publishes its own static mingw-x64 tree, so the job reads that: same asset
      # publish.yml uses, checksum-verified, and it is what a Windows consumer actually links.
      # Shared FFmpeg builds (DLLs plus import libraries) have no libavformat.a to embed.
      - name: Fetch the prebuilt static FFmpeg (mingw-x64)
        shell: pwsh
        run: |
          $base = "https://github.com/${{ github.repository }}/releases/download/$env:FFMPEG_ASSET_TAG"
          $asset = "ffmpeg-$env:FFMPEG_VERSION-lgpl-mingw-x64.zip"
          Invoke-WebRequest -Uri "$base/$asset" -OutFile $asset
          Invoke-WebRequest -Uri "$base/$asset.sha256" -OutFile "$asset.sha256"
          $expected = (Get-Content "$asset.sha256").Split()[0].ToLower()
          $actual = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "sha256 mismatch: expected $expected, got $actual" }
          New-Item -ItemType Directory -Force -Path native-libs/lgpl/mingw-x64 | Out-Null
          Expand-Archive $asset -DestinationPath native-libs/lgpl/mingw-x64 -Force
          if (-not (Test-Path native-libs/lgpl/mingw-x64/lib/libavformat.a)) {
            throw "unpacked tree has no lib/libavformat.a"
          }
          Remove-Item $asset, "$asset.sha256"
      # The same patch check as the other fetch steps (#175), in the runner's Git Bash.
      - name: Check the tree carries every committed patch
        run: ./scripts/check-tree-patches.sh native-libs/lgpl/mingw-x64
      # The ffmpeg CLI for scripts/e2e.sh's assertions only; not what gets linked.
      - name: Install the ffmpeg CLI (for e2e assertions only)
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      # kotlin.bat is the Windows wrapper of the Kotlin Toolchain.
      - name: Unit + native tests
        shell: cmd
        run: kotlin.bat test -m kiteffmpeg -p mingwX64
      - name: Link sample
        shell: cmd
        run: kotlin.bat build -m kiteffmpeg-sample-windows -p mingwX64
      - name: End-to-end transcode
        run: scripts/e2e.sh "$(find build/tasks -name 'kiteffmpeg-sample-windows.exe' -type f | head -1)" ffmpeg ffprobe
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-windows-x64
          path: |
            build/reports/**
            build/test-results/**
          retention-days: 7
          if-no-files-found: ignore
