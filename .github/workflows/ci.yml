# Builds + tests kitecodec-core and runs an end-to-end transcode on every desktop K/N target
# that can get an FFmpeg toolchain in CI:
#
#   - macOS arm64  → Homebrew FFmpeg (8.x), dynamic linking
#   - Linux x64    → Ubuntu apt FFmpeg (6.x). The def has held no C since B1.3, so there is no
#                    "compat path in ffmpeg.def" for this job to prove (a sentence here once
#                    claimed one); what it actually proves is that the C units and the cinterop
#                    declarations compile against the oldest supported headers. The measured
#                    compilation floor is lavc 60.30.100 and lavu 58.7.100.
#   - Windows x64  → BtbN mingw shared build dropped into native-libs/mingw-x64 (vendored path)
#   - macOS arm64  → the VENDORED LGPL profile, built from source (see the vendored-lgpl job).
#                    The three above all link a full GPL system FFmpeg; this one links what the
#                    project actually ships, and is the only job that can catch the suite depending
#                    on codecs, muxers or protocols the released artifact does not contain.
#
# Android NDK targets get compile checks: each ABI builds its (self-contained, cached) LGPL
# FFmpeg and compiles the klib.
#
# Not covered (yet): iosArm64 and iosSimulatorArm64 LGPL are locally buildable with the standard
# software-playback profile, but this workflow has no job for either and makes no CI claim for
# them. iosX64 remains unqualified, and there are no iOS GPL build tasks. linuxArm64 needs an arm64
# runner with K/N host support; macosX64 is deprecated by Kotlin 2.3.20.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: macOS arm64 (brew FFmpeg)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-macos-arm64-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-macos-arm64-
      # Pinned at the interlude (I-15). klib-metadata-baseline.txt freezes 24 FFmpeg version
      # constants down to their micro values, so an unpinned `brew install ffmpeg` turns every
      # Homebrew version bump into a red metadata check whose cheapest exit is an --update that
      # could absorb a real surface change in the same commit. Homebrew offers no formula pinned
      # to this exact release (ffmpeg@8 is an alias of the moving main formula, checked
      # 2026-08-10), so the pin is an assert: install, then refuse any header tree other than the
      # exact avutil version the committed baseline froze. When this step goes red, the move is
      # deliberate: bump the local FFmpeg, re-baseline with klib-metadata-diff.sh --update, update
      # the version below in the same commit, and paste the script's SUMMARY block into the
      # Execution log entry (KPKMP.md section 9's ratchet move table).
      - name: Install FFmpeg (pinned by assert)
        run: |
          brew install ffmpeg
          V="$(awk '/#define LIBAVUTIL_VERSION_(MAJOR|MINOR|MICRO)/ {printf "%s.", $3}' \
            "$(brew --prefix)/include/libavutil/version.h")"
          V="${V%.}"
          if [ "$V" != "60.8.100" ]; then
            echo "Homebrew installed FFmpeg with libavutil $V; the committed metadata baseline froze 60.8.100."
            echo "This is the pin from KPKMP.md I-15 firing, not a broken build."
            echo "Move it deliberately: re-baseline with native/kitecodec-c/scripts/klib-metadata-diff.sh --update,"
            echo "update the version in this step, and log the SUMMARY block, all in one commit."
            exit 1
          fi
      # The two ratchets. apiCheck compares kitecodec-core's klib against the committed dump in
      # kitecodec-core/api, so a public API change fails here instead of shipping.
      # checkCinteropCoupling recounts the Kotlin-to-FFmpeg coupling and fails when it grew.
      #
      # -Pkitecodec.hostTargetsOnly=true is load bearing, not cosmetic: this runner has only brew
      # FFmpeg, so no FFmpeg tree resolves for the other ten registered targets, their ffmpeg
      # cinterop is skipped, and compileKotlin<Target> then fails on unresolved `ffmpeg` references.
      # The committed dump is therefore a macosArm64 dump, and apiCheck has to be scoped the same
      # way it was produced. Widening it to every target needs an FFmpeg tree per target in CI.
      # check-deleted-surface.sh joined this step at the interlude (I-15): it needs no build
      # output, only the tree, and it holds the fifteen deleted ffkmp_ names dead in both
      # repositories. Here it can only scan this one; KitePlayer has no CI yet (B8).
      - name: Public API baseline + FFmpeg coupling ratchet + deleted surface
        run: |
          ./gradlew :kitecodec-core:apiCheck -Pkitecodec.hostTargetsOnly=true --stacktrace
          ./gradlew checkCinteropCoupling --stacktrace
          ./native/kitecodec-c/scripts/check-deleted-surface.sh
      # The third ratchet, and the only guard on the cinterop klib: apiCheck covers kitecodec-core's
      # own klib, and the cinterop klib is a separate artifact holding every FFmpeg binding and every
      # ffkmp_ helper. klib-metadata-diff.sh --check dumps its metadata and fails when it differs
      # from the committed baseline. Deliberate changes re-baseline with --update in the same commit.
      #
      # The archive listing is the producer-side half of register item B1-11. The C compile task
      # asserts each object's architecture before archiving, which is what actually prevents a
      # wrong-architecture library reaching a consumer; this prints what was built, per target
      # directory, so the log says which targets got one. `file` on an ar archive names the format
      # and not the architecture, so the objects are listed too, where it does.
      - name: Cinterop metadata baseline + the C archives that were built
        run: |
          ./gradlew :kitecodec-core:cinteropFfmpegMacosArm64 -Pkitecodec.hostTargetsOnly=true --stacktrace
          ./native/kitecodec-c/scripts/klib-metadata-diff.sh --check
          for archive in kitecodec-core/build/kitecodec-c/*/libkitecodec.a; do
            echo "$archive: $(file -b "$archive")"
          done
          for object in kitecodec-core/build/kitecodec-c/*/obj/*.o; do
            echo "$object: $(file -b "$object")"
          done
      - name: Unit + native tests
        run: ./gradlew :kitecodec-core:macosArm64Test --stacktrace
      # buildSrc's tests are not in the main build's task graph, so they need naming. They cover the
      # coupling ratchet and the C compile task, including its wrong-architecture refusal.
      - name: Build-logic tests
        run: ./gradlew :buildSrc:test --stacktrace
      - name: Link sample
        run: ./gradlew :kitecodec-sample:linkDebugExecutableMacosArm64
      - name: End-to-end transcode
        run: scripts/e2e.sh kitecodec-sample/build/bin/macosArm64/debugExecutable/kitecodec-sample.kexe
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-macos-arm64
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 7
          if-no-files-found: ignore

  ffmpeg-identity-gate:
    # ---------------------------------------------------------------------------------------------
    # Added by B1.6. Deliberately its own job and not steps inside macos-arm64, so that this block
    # can be moved, reordered or merged without touching anything another sub-phase wrote.
    # ---------------------------------------------------------------------------------------------
    name: Host C suites and the FFmpeg identity gate (register items B1-02, KC-CI-C)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install FFmpeg
        run: brew install ffmpeg
      # ALL EIGHT suites, not one. Until 2026-08-23 both steps below passed `test_identity` as an
      # explicit argument, so test_ownership, test_buffers, test_rescale, test_strerror_thread,
      # test_convert, test_args and test_append ran only on a developer's laptop. Every "C suites
      # green" line in the log was then a true statement about one machine and a false impression
      # about this gate (register item KC-CI-C). Passing no suite name runs the whole list, which is
      # what run-c-tests.sh documents as gate behaviour.
      #
      # test_identity is still the reason this job is separate, and what it does is worth keeping
      # written down: it compiles src/kitecodec_abi.c five more times against the doctored header
      # trees under tests/fake_headers/ and asserts one case per verdict, including the TRUE build,
      # which is the case that fails if the policy is too strict. It also asserts that the
      # diagnostic bypass is not a silent default, that it works when set, and that its warning is
      # printed exactly once per process.
      #
      # What each variant is for. ASan catches the class the identity gate exists to prevent, an
      # out-of-bounds read through a struct field offset that moved. Plain compiles the doctored
      # objects at -O2, so a shim that only worked at -O1 is a shim that only worked under a
      # sanitizer. Both are needed; neither replaces the other.
      - name: Host C suites under ASan
        working-directory: native/kitecodec-c
        run: |
          ./scripts/build-host.sh asan
          ./scripts/run-c-tests.sh asan
      - name: Host C suites plain
        working-directory: native/kitecodec-c
        run: |
          ./scripts/build-host.sh plain
          ./scripts/run-c-tests.sh plain
      # What the archive promises. The six kc_ functions must be exported and nothing else new must
      # be, the identity gate's undefined symbols must all be on the measured allowlist, and it must
      # be the ONLY unit in the library that writes to a stream: that permission exists for the
      # bypass warning alone.
      - name: Symbol audit of the host archive
        working-directory: native/kitecodec-c
        run: ./scripts/symbol-audit.sh --host
      # The Kotlin end of the gate: the report crossing into Kotlin with both version columns, the
      # typed FFmpegError a consumer can catch, and the entry points letting a healthy runtime
      # through. Plus the build-side checks of register items B1-03 and B1-04.
      - name: Kotlin surface and build-side checks
        run: |
          ./gradlew :kitecodec-core:macosArm64Test --tests '*FFmpegIdentityTest*' \
            -Pkitecodec.hostTargetsOnly=true --stacktrace
          ./gradlew :buildSrc:test --stacktrace
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-ffmpeg-identity-gate
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 7
          if-no-files-found: ignore

  linux-x64:
    name: Linux x64 (apt FFmpeg)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-linux-x64-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-linux-x64-
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg \
            libavformat-dev libavcodec-dev libavfilter-dev \
            libavutil-dev libswscale-dev libswresample-dev
      - name: Unit + native tests
        run: ./gradlew :kitecodec-core:linuxX64Test --stacktrace
      - name: Link sample
        run: ./gradlew :kitecodec-sample:linkDebugExecutableLinuxX64
      - name: End-to-end transcode
        run: scripts/e2e.sh kitecodec-sample/build/bin/linuxX64/debugExecutable/kitecodec-sample.kexe
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-linux-x64
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 7
          if-no-files-found: ignore

  # The only place coverage-guided fuzzing can happen. Plan sub-phase B1.5, register item B1-13.
  #
  # macOS cannot run this and the reason is not a preference. libclang_rt.fuzzer_osx.a ships with
  # neither Apple clang 17 nor konan's LLVM 21, and Homebrew LLVM is not installed on the proving
  # machine, so -fsanitize=fuzzer fails at the link there. Only the header directory
  # lib/clang/17/include/fuzzer exists; -fsanitize=fuzzer-no-link compiles but produces
  # instrumentation with no driver, which fuzzes nothing. So the six targets get two drivers over
  # one body: libFuzzer here, and a committed-corpus replay under ASan and UBSan everywhere else.
  # native/kitecodec-c/scripts/replay-corpus.sh is that replay and it is a regression test, not a
  # fuzz run. This job is the fuzz run.
  #
  # LeakSanitizer is the second thing this job has and macOS does not (register item B1-14):
  # detect_leaks=1 on an ASan binary built by Apple clang answers "detect_leaks is not supported on
  # this platform". run-fuzz.sh turns it on here.
  #
  # HONEST STATUS, and it belongs in the file rather than only in a report: at the time this job was
  # added, it had never been executed. There is no Linux host on the proving machine. What WAS
  # verified locally is every step except the fuzzer link and the fuzz run itself: the compile of all
  # ten helper units plus the shared plumbing plus all six targets under
  # -fsanitize=fuzzer-no-link,address,undefined with -Wall -Wextra -Werror, and run-fuzz.sh's own
  # preflight, which detects a toolchain that cannot link libFuzzer and exits 3 with one sentence.
  # The first real run may need one thing classified that a replay never sees: a caller-supplied
  # filter description can exhaust memory or time long before it corrupts anything, and an
  # out-of-memory or a timeout is a resource finding rather than a memory-safety one. The budget
  # flags in run-fuzz.sh (-max_len, -rss_limit_mb, -malloc_limit_mb, -timeout) are set to keep that
  # rare rather than to hide it, and resource policy is B8's by the same wording that gives it the
  # container bytes.
  fuzz-linux:
    name: Fuzz the C string entry points (libFuzzer, ubuntu-24.04)
    runs-on: ubuntu-24.04
    # Six targets at five minutes each is 30 minutes of fuzzing, plus the FFmpeg install and the
    # instrumented build of the helper layer once per target.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # clang-18 is ubuntu-24.04's default clang. libclang-rt-18-dev is the package that actually
      # carries libclang_rt.fuzzer.a, and it is the whole reason this job can exist: without it the
      # link fails here exactly as it does on macOS, and run-fuzz.sh's preflight says so and exits 3
      # rather than burying the reason in a linker error.
      - name: Install clang, the libFuzzer runtime and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-rt-18-dev pkg-config \
            libavformat-dev libavcodec-dev libavfilter-dev \
            libavutil-dev libswscale-dev libswresample-dev
      - name: Fuzz all six targets, five minutes each
        env:
          KC_CC: clang-18
          KC_FUZZ_SECONDS: 300
          KC_ARTIFACT_DIR: ${{ github.workspace }}/fuzz-artifacts
        run: ./native/kitecodec-c/scripts/run-fuzz.sh
      # Any crash, timeout or out-of-memory artifact libFuzzer saved. Uploaded on failure only,
      # because on success there are none and an empty artifact is noise. The corpus a run grew is
      # deliberately NOT uploaded or committed: growing the committed corpus is a decision somebody
      # makes after reading the new inputs, never a side effect of CI.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz-artifacts/**
          retention-days: 14
          if-no-files-found: ignore
      # The replay driver, on the same runner, right after the fuzz run. It is cheap, it is the thing
      # every other gate runs, and running it here proves the committed corpus and the replay build
      # work on a second platform rather than only on the machine that wrote them.
      #
      # The helper archive is built inline here rather than with native/kitecodec-c/scripts/
      # build-host.sh, and that is not a shortcut. build-host.sh is macOS only by construction: it
      # also builds the allocation interposer, and that needs `-dynamiclib`, `-install_name` and the
      # Mach-O `__DATA,__interpose` section, none of which exist on Linux. The interposer exists
      # because LeakSanitizer is unsupported on macOS arm64 (register item B1-14), which is exactly
      # the instrument this runner HAS, so Linux never needs it. Making build-host.sh conditional is
      # a change to a file B1.5 does not own; until that lands, six lines of clang here keep the
      # Linux replay honest. replay-corpus.sh never builds the helper layer itself, deliberately, so
      # it needs the archive at that exact path.
      - name: Replay the committed corpus under ASan and UBSan
        if: always()
        env:
          KC_CC: clang-18
        run: |
          set -euo pipefail
          cd native/kitecodec-c
          mkdir -p build/asan/lib build/asan/obj
          FF_CFLAGS="$(pkg-config --cflags libavformat libavcodec libavfilter libavutil libswscale libswresample)"
          for source in src/*.c; do
            # FF_CFLAGS is a list of -I flags and must word split.
            # shellcheck disable=SC2086
            clang-18 -std=c11 -Wall -Wextra -Werror -Werror=vla -g \
              -fsanitize=address,undefined -fno-omit-frame-pointer -O1 \
              $FF_CFLAGS -I include -fvisibility=hidden \
              -c "$source" -o "build/asan/obj/$(basename "${source%.c}").o"
          done
          ar rcs build/asan/lib/libkitecodec_helpers_host.a build/asan/obj/*.o
          ./scripts/replay-corpus.sh asan

  # THE job that keeps the library honest about what it ships.
  #
  # Every other desktop job links the runner's brew/apt FFmpeg, a full GPL build with every codec
  # compiled in. What users actually get is the vendored LGPL profile from BuildFFmpegTask: no
  # libx264, a deliberately small codec/muxer/protocol set. Testing only against the system build
  # means the test suite and the sample can drift into depending on codecs the shipped artifact
  # does not contain, and nothing notices. So: build the real profile from source, put it under
  # native-libs/ (where FFmpegPaths prefers it over any system install), and run the whole suite
  # against that: unit tests, native tests, and the full e2e.
  vendored-lgpl:
    name: macOS arm64 (vendored LGPL FFmpeg, the shipped profile)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-vendored-lgpl-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-vendored-lgpl-
      # The desktop LGPL profile links these; several (lame above all) ship no pkg-config file,
      # which is why BuildFFmpegTask passes an explicit -I/-L for the Homebrew prefix.
      # `ffmpeg` itself is for scripts/e2e.sh's CLI generation + ffprobe assertions only. KiteCodec
      # links the vendored tree, not this one.
      # meson and ninja are for dav1d, which BuildDav1dTask drives and which became a mandatory
      # dependency of the FFmpeg build with KC-EMBED. Its own preflight says "brew install meson
      # ninja nasm"; nasm was already here for FFmpeg's x86 asm, the other two were not.
      - name: Install build deps + the ffmpeg CLI (for e2e assertions)
        run: brew install nasm meson ninja svt-av1 aom libvpx opus lame webp freetype harfbuzz fribidi libass ffmpeg jq
      # BOTH output trees, because since KC-EMBED the FFmpeg build depends on a dav1d build and
      # dav1d installs to native-libs/deps/<triple>/dav1d, NOT under native-libs/lgpl/. Caching only
      # the lgpl path meant a cache hit restored FFmpeg, left dav1d missing, and the dav1d task then
      # ran and demanded a source tree the workflow never cloned. The key also hashes BuildDav1dTask
      # so a change to either build task invalidates both trees together.
      - name: Cache the vendored FFmpeg and dav1d builds
        id: ffmpeg-vendored
        uses: actions/cache@v4
        with:
          path: |
            native-libs/lgpl/macos-arm64
            native-libs/deps/macos-arm64
          key: ffmpeg-macos-arm64-lgpl-n8.0-${{ hashFiles('buildSrc/src/main/kotlin/BuildFFmpegTask.kt', 'buildSrc/src/main/kotlin/BuildDav1dTask.kt') }}
      - name: Build the vendored LGPL FFmpeg from source
        if: steps.ffmpeg-vendored.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch n8.0 https://github.com/FFmpeg/FFmpeg.git vendor/ffmpeg
          git clone --depth 1 --branch 1.5.4 https://code.videolan.org/videolan/dav1d vendor/dav1d
          ./gradlew :kitecodec-core:buildFFmpegForMacosArm64 --stacktrace
      - name: Confirm the vendored tree is what gets linked
        run: test -f native-libs/lgpl/macos-arm64/lib/libavformat.a
      # No -Pkitecodec.ffmpeg.license=gpl anywhere below: LGPL is the shipping default.
      - name: Unit + native tests against the vendored build
        run: ./gradlew :kitecodec-core:macosArm64Test --stacktrace
      - name: Link sample
        run: ./gradlew :kitecodec-sample:linkDebugExecutableMacosArm64
      - name: End-to-end transcode against the vendored build
        run: scripts/e2e.sh kitecodec-sample/build/bin/macosArm64/debugExecutable/kitecodec-sample.kexe
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-vendored-lgpl
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 7
          if-no-files-found: ignore

  android:
    name: Android ${{ matrix.abi }} (NDK FFmpeg, LGPL profile)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: arm64, triple: android-arm64, task: AndroidArm64, kotlinTarget: AndroidNativeArm64 }
          - { abi: arm32, triple: android-arm32, task: AndroidArm32, kotlinTarget: AndroidNativeArm32 }
          - { abi: x64,   triple: android-x64,   task: AndroidX64,   kotlinTarget: AndroidNativeX64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-android-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-android-
      # The NDK cross-compile of FFmpeg takes ~6 min per ABI, so cache the resulting static libs
      # and only rebuild when the build-task definition (codec set, flags) changes.
      # Both trees and both sources, for the reason spelled out on the macOS vendored job above:
      # dav1d became mandatory with KC-EMBED, it installs to native-libs/deps/<triple>/dav1d, and
      # nothing here ever cloned it. That is why every Android ABI died in under a minute on
      # buildDav1dFor<Target> with "dav1d source not found".
      - uses: actions/cache@v4
        id: ffmpeg-android
        with:
          path: |
            native-libs/lgpl/${{ matrix.triple }}
            native-libs/deps/${{ matrix.triple }}
          key: ffmpeg-${{ matrix.triple }}-lgpl-n8.0-api24-${{ hashFiles('buildSrc/src/main/kotlin/BuildFFmpegTask.kt', 'buildSrc/src/main/kotlin/BuildDav1dTask.kt') }}
      - name: Install the dav1d build tools
        if: steps.ffmpeg-android.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build nasm
      - name: Build FFmpeg and dav1d for Android (NDK)
        if: steps.ffmpeg-android.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch n8.0 https://github.com/FFmpeg/FFmpeg.git vendor/ffmpeg
          git clone --depth 1 --branch 1.5.4 https://code.videolan.org/videolan/dav1d vendor/dav1d
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./gradlew :kitecodec-core:buildFFmpegFor${{ matrix.task }} --stacktrace
      - name: Compile kitecodec-core klib (${{ matrix.kotlinTarget }})
        run: ./gradlew :kitecodec-core:compileKotlin${{ matrix.kotlinTarget }} --stacktrace
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-android-${{ matrix.abi }}
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 7
          if-no-files-found: ignore

  # Consumer end-to-end smoke: publishes kitecodec-core + the Gradle plugin to mavenLocal from
  # this checkout (host desktop target only, via -Pkitecodec.hostTargetsOnly=true, see
  # kitecodec-core/build.gradle.kts), generates a throwaway consumer project, and builds + RUNS a
  # real executable that calls into FFmpeg. This proves the full consumer chain end to end:
  # plugin resolution from mavenLocal, klib + bundled cinterop compile, final native link, and
  # runtime symbol resolution.
  #
  # System-source smoke (FFmpegSource.System against the runner's brew/apt FFmpeg).
  # TODO(post-first-release): add a Prebuilt-source variant once the ffmpeg-n8.0 release assets
  # are public, to also smoke the fetch + static-link path.
  consumer-e2e:
    name: Consumer e2e smoke (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, label: macos-arm64, target: macosArm64, taskSuffix: MacosArm64 }
          - { os: ubuntu-24.04, label: linux-x64,   target: linuxX64,   taskSuffix: LinuxX64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-consumer-${{ matrix.label }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-consumer-${{ matrix.label }}-
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg \
            libavformat-dev libavcodec-dev libavfilter-dev \
            libavutil-dev libswscale-dev libswresample-dev
      # The C helper tasks compile with konan's own LLVM, which only lands in ~/.konan/dependencies
      # once a Kotlin/Native compile has run. On a fresh runner the C task races it and dies with
      # "No LLVM package with a usable clang ... Expected llvm-21-aarch64-macos-essentials-97",
      # which is exactly how both of these jobs failed. publish.yml already carries this warmup for
      # the same reason (register row KC-CI-KONAN); it was never copied here.
      - name: Warm the Kotlin/Native toolchain
        run: ./gradlew :kitecodec-core:compileKotlin${{ matrix.taskSuffix }} -Pkitecodec.hostTargetsOnly=true --stacktrace || true
      # The publish guard accepts hostTargetsOnly for publishToMavenLocal only, so this works with
      # just the runner's system FFmpeg (no android/vendored trees needed).
      - name: Publish library + plugin to mavenLocal
        run: ./gradlew publishToMavenLocal -Pkitecodec.hostTargetsOnly=true --no-configuration-cache --stacktrace
      - name: Generate throwaway consumer project
        run: |
          set -euo pipefail
          VERSION="$(grep '^VERSION=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          KOTLIN_VERSION="$(grep -E '^kotlin = ' gradle/libs.versions.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          consumer="$RUNNER_TEMP/kitecodec-smoke"
          mkdir -p "$consumer/src/commonMain/kotlin"
          cat > "$consumer/settings.gradle.kts" <<EOF
          pluginManagement {
              repositories {
                  mavenLocal()
                  mavenCentral()
                  gradlePluginPortal()
                  google()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  mavenLocal()
                  mavenCentral()
                  google()
              }
          }
          rootProject.name = "kitecodec-smoke"
          EOF
          cat > "$consumer/build.gradle.kts" <<EOF
          import io.github.yuroyami.kitecodec.gradle.FFmpegLicense
          import io.github.yuroyami.kitecodec.gradle.FFmpegSource

          plugins {
              id("org.jetbrains.kotlin.multiplatform") version "$KOTLIN_VERSION"
              id("io.github.yuroyami.kitecodec") version "$VERSION"
          }

          kotlin {
              ${{ matrix.target }} {
                  binaries.executable {
                      entryPoint = "main"
                  }
              }
              sourceSets {
                  commonMain.dependencies {
                      implementation("io.github.yuroyami:kitecodec-core:$VERSION")
                  }
              }
          }

          kitecodec {
              ffmpeg {
                  license = FFmpegLicense.LGPL
                  source = FFmpegSource.System
              }
          }
          EOF
          cat > "$consumer/src/commonMain/kotlin/Main.kt" <<'EOF'
          import io.github.yuroyami.kitecodec.FFmpeg

          fun main() {
              // Touches real FFmpeg symbols at runtime, which proves the cinterop klib linked and loads.
              println("KITECODEC_SMOKE avutil=${FFmpeg.versions.avutil} avcodec=${FFmpeg.versions.avcodec}")
          }
          EOF
      # The repo's wrapper drives the consumer build via -p (the consumer ships no wrapper).
      - name: Build consumer executable
        run: ./gradlew -p "$RUNNER_TEMP/kitecodec-smoke" linkDebugExecutable${{ matrix.taskSuffix }} --stacktrace
      - name: Run consumer executable
        run: |
          set -euo pipefail
          out="$("$RUNNER_TEMP/kitecodec-smoke/build/bin/${{ matrix.target }}/debugExecutable/kitecodec-smoke.kexe")"
          echo "$out"
          echo "$out" | grep -q "KITECODEC_SMOKE avutil="
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-consumer-e2e-${{ matrix.label }}
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 7
          if-no-files-found: ignore

  windows-x64:
    name: Windows x64 (BtbN FFmpeg, mingw)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # Pinned BtbN autobuild (master branch build), never `latest`, which is a moving tag.
      # To bump: pick a newer tag from https://github.com/BtbN/FFmpeg-Builds/releases, download
      # the win64-gpl-shared asset once, and update all three values together.
      #
      # KNOWN TO ROT, and it did. The previous pin (autobuild-2026-07-01-13-54) returned 404 on
      # 2026-08-23: BtbN PRUNES old autobuild releases, so a pin is only good for a few weeks and
      # this job goes red on a schedule nobody set. Re-pinned here to keep it green today, but the
      # durable fix is to stop depending on someone else's retention policy and feed this job the
      # mingw-x64 asset from THIS project's own releases, which is what the vendored-tree jobs
      # already do and what register row KC-CI-KONAN asks for. Row: KC-BTBN-ROT.
      BTBN_TAG: autobuild-2026-08-23-13-03
      BTBN_ASSET: ffmpeg-N-126247-gb79d4c4c0a-win64-gpl-shared.zip
      BTBN_SHA256: 18bd59b528f286b48163ba7ebcd948ae1c38ff792599c2d42d1581871c642064
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-windows-x64-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-windows-x64-
      - name: Cache FFmpeg download (BtbN win64 gpl shared)
        id: ffmpeg-btbn
        uses: actions/cache@v4
        with:
          path: ffmpeg.zip
          key: btbn-${{ env.BTBN_TAG }}-${{ env.BTBN_ASSET }}
      - name: Download FFmpeg (BtbN win64 gpl shared)
        if: steps.ffmpeg-btbn.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/$env:BTBN_TAG/$env:BTBN_ASSET"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Write-Host "Download failed (attempt $attempt): $_, retrying..."
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
      # The shared (DLL) mingw build carries include/ + lib/ import libraries, exactly the
      # layout FFmpegPaths expects under native-libs/<license>/<target>/. It is the GPL variant
      # (libx264 for the e2e encode), so it lands under the `gpl` flavour and the Gradle calls
      # select it with -Pkitecodec.ffmpeg.license=gpl. CI never redistributes the binaries.
      - name: Verify + install FFmpeg
        shell: pwsh
        run: |
          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:BTBN_SHA256) {
            throw "ffmpeg.zip sha256 mismatch: expected $env:BTBN_SHA256, got $actual"
          }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          $dir = Get-ChildItem ffmpeg-tmp -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path native-libs/gpl | Out-Null
          Move-Item $dir.FullName native-libs/gpl/mingw-x64
          Add-Content -Path $env:GITHUB_PATH -Value "${{ github.workspace }}\native-libs\gpl\mingw-x64\bin"
      - name: Unit + native tests
        run: ./gradlew :kitecodec-core:mingwX64Test -Pkitecodec.ffmpeg.license=gpl --stacktrace
      - name: Link sample
        run: ./gradlew :kitecodec-sample:linkDebugExecutableMingwX64 -Pkitecodec.ffmpeg.license=gpl
      - name: End-to-end transcode
        run: scripts/e2e.sh kitecodec-sample/build/bin/mingwX64/debugExecutable/kitecodec-sample.exe ffmpeg ffprobe
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-windows-x64
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 7
          if-no-files-found: ignore
