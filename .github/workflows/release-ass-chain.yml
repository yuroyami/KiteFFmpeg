# Builds the libass chain (FriBidi, FreeType, HarfBuzz, libass) as static archives for every target
# kiteplayer-libass ships, the web included, and attaches them to a release as ass-chain-<target>.zip.
#
# The chain is what kiteplayer-libass embeds into its klibs and links its JNI adapters from. That
# module finds a chain in the sibling checkout when there is one and downloads it from the release
# named here otherwise, verifying the SHA-256 pinned in its ass-chain.sha256. A new chain build is
# therefore two steps: run this workflow against a new tag, then re-pin in KitePlayer.
#
# The tag is chain-keyed (ass-chain-r1, r2, ...), not KiteFFmpeg-versioned: the zips are identical
# across KiteFFmpeg versions, the same way the FFmpeg binaries are. Each chain rebuild takes the next
# tag. A released KitePlayer pins the digests of its tag, so an attached asset is never replaced
# with other bytes.
name: Release libass chain

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach the chain zips to (chain-keyed, e.g. ass-chain-r2)."
        required: true
        default: "ass-chain-r2"

permissions:
  contents: read

concurrency:
  group: release-ass-chain-${{ github.event.inputs.release_tag }}
  cancel-in-progress: false

# Each tag must be the one BuildAssChainTask.SOURCES pins beside its commit: the build refuses a
# checkout at any other commit, so a tag changed here alone stops the run before it compiles.
env:
  FRIBIDI_TAG: v1.0.17
  FREETYPE_TAG: VER-2-14-3
  HARFBUZZ_TAG: 14.5.0
  LIBASS_TAG: 0.17.5

jobs:
  # Android and the GNU targets cross-build from macOS too: the konan toolchains the Linux and
  # Windows chains use are the ones Kotlin/Native itself downloads, and the Android chain uses the
  # NDK the runner image ships. One runner family keeps the arm64 archive format question (see
  # BuildAssChainTask's llvm-ar note) identical to the maintainer's machine.
  chains:
    name: ${{ matrix.target }}
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - macos-arm64
          - ios-arm64
          - ios-simulator-arm64
          - android-arm64
          - android-arm32
          - android-x64
          - linux-x64
          - linux-arm64
          - mingw-x64
          - wasm32
        include:
          - { target: macos-arm64,          task: MacosArm64 }
          - { target: ios-arm64,            task: IosArm64 }
          - { target: ios-simulator-arm64,  task: IosSimulatorArm64 }
          - { target: android-arm64,        task: AndroidArm64 }
          - { target: android-arm32,        task: AndroidArm32 }
          - { target: android-x64,          task: AndroidX64 }
          - { target: linux-x64,            task: LinuxX64 }
          - { target: linux-arm64,          task: LinuxArm64 }
          - { target: mingw-x64,            task: MingwX64 }
          - { target: wasm32,               task: Wasm32 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-ass-chain-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-ass-chain-
      - name: Install build deps
        run: brew install meson ninja autoconf automake libtool pkg-config nasm
      # The web chain compiles with emscripten; the konan targets never touch it.
      - name: Install emscripten
        if: matrix.target == 'wasm32'
        run: brew install emscripten
      - name: Clone the chain sources
        run: |
          git clone --depth 1 --branch "$FRIBIDI_TAG" https://github.com/fribidi/fribidi.git vendor/fribidi
          git clone --depth 1 --branch "$FREETYPE_TAG" https://gitlab.freedesktop.org/freetype/freetype.git vendor/freetype
          git clone --depth 1 --branch "$HARFBUZZ_TAG" https://github.com/harfbuzz/harfbuzz.git vendor/harfbuzz
          git clone --depth 1 --branch "$LIBASS_TAG" https://github.com/libass/libass.git vendor/libass
      # The Linux and Windows chains compile with konan's clang and link with its sysroots, which
      # arrive when Kotlin/Native compiles for those targets once. Cheap, and it cannot be skipped.
      - name: Warm the Kotlin/Native toolchains the chain needs
        if: startsWith(matrix.target, 'linux') || startsWith(matrix.target, 'mingw')
        run: ./gradlew :kiteffmpeg:compileKotlin${{ matrix.task }} --stacktrace || true
      - name: Build the chain
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./gradlew :kiteffmpeg:buildAssChainFor${{ matrix.task }} --stacktrace
      - name: Package
        run: bash scripts/package-ass-chain.sh ${{ matrix.target }}
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ass-chain-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attach to ${{ github.event.inputs.release_tag }}
    needs: chains
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Attach the chains to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          ls -la assets
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$REPO" \
              --title "libass chain $TAG" \
              --notes "Static libass, HarfBuzz, FreeType and FriBidi archives for kiteplayer-libass. See docs/licensing.md."
          # An asset already attached with the same bytes is skipped. Different bytes stop the job,
          # because KitePlayer pins the digest of every asset it downloads.
          attached="$(mktemp -d)"
          for asset in assets/*; do
            name="$(basename "$asset")"
            if gh release download "$TAG" --repo "$REPO" --pattern "$name" --dir "$attached" 2>/dev/null; then
              if cmp -s "$asset" "$attached/$name"; then
                echo "$name is already attached with the same bytes"
                continue
              fi
              echo "::error::$name is already attached to $TAG with different bytes. Run this workflow with a new release tag."
              exit 1
            fi
            gh release upload "$TAG" "$asset" --repo "$REPO"
          done
