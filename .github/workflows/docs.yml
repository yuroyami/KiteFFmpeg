name: Docs

# Builds the MkDocs Material site + the Dokka API reference and deploys both to
# GitHub Pages (https://yuroyami.github.io/KiteCodec/). The API reference lands at
# /api/ to match the "API reference ▸" link in mkdocs.yml.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '**/*.kt'
      - '**/build.gradle.kts'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs Material
        run: pip install -r docs/requirements.txt

      - name: Build the docs site
        run: mkdocs build --strict --site-dir site

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ALL ELEVEN triples, and it has to be all of them. Dokka compiles
      # `compileNativeMainKotlinMetadata`, the shared nativeMain source set, which needs the ffmpeg
      # cinterop for EVERY native target at once; a target with no FFmpeg tree has its cinterop
      # skipped and the metadata compile then fails with `Unresolved reference 'ffmpeg'`.
      #
      # apt cannot serve this even for Linux: Ubuntu's libav* .so files reference glibc 2.29/2.34
      # while Kotlin/Native links its own glibc 2.19 sysroot. These are the same prebuilt static
      # zips publish.yml uses, from this repository's own companion release, checksum-verified.
      - name: Fetch the prebuilt static FFmpeg (all 11 triples)
        env:
          FFMPEG_VERSION: n8.0
        run: |
          set -euo pipefail
          base="https://github.com/${{ github.repository }}/releases/download/ffmpeg-${FFMPEG_VERSION}"
          for triple in macos-arm64 macos-x64 ios-arm64 ios-simulator-arm64 ios-x64 \
                        linux-x64 linux-arm64 mingw-x64 android-arm64 android-arm32 android-x64; do
            asset="ffmpeg-${FFMPEG_VERSION}-lgpl-${triple}.zip"
            curl -fL --retry 3 -o "${asset}" "${base}/${asset}"
            curl -fL --retry 3 -o "${asset}.sha256" "${base}/${asset}.sha256"
            shasum -a 256 -c "${asset}.sha256"
            mkdir -p "native-libs/lgpl/${triple}"
            unzip -q "${asset}" -d "native-libs/lgpl/${triple}"
            test -f "native-libs/lgpl/${triple}/lib/libavformat.a"
            rm -f "${asset}" "${asset}.sha256"
          done

      # The C helper tasks compile with konan's own LLVM, which only lands in
      # ~/.konan/dependencies once a Kotlin/Native compile has run. On a fresh
      # runner the C task races it and dies with "No LLVM package with a usable
      # clang", which is how this workflow failed on every push (register row
      # KC-CI-KONAN). ci.yml's consumer jobs and publish.yml both carry this
      # warmup; the docs job was the last one without it.
      - name: Warm the Kotlin/Native toolchain
        run: ./gradlew :kitecodec-core:compileKotlinLinuxX64 --stacktrace || true

      # The Dokka generation + merge is required: the deployed site must never
      # silently lose its /api/ reference.
      - name: Generate the Dokka API reference and merge it into the site
        run: |
          ./gradlew dokkaGenerate --no-configuration-cache
          mkdir -p site/api
          cp -r build/dokka/html/. site/api/

      - name: Disable Jekyll processing
        run: touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
