name: Docs

# Builds the MkDocs Material site + the Dokka API reference and deploys both to
# GitHub Pages (https://yuroyami.github.io/KiteFFmpeg/). The API reference lands at
# /api/ to match the "API reference ▸" link in mkdocs.yml.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '**/*.kt'
      - '**/build.gradle.kts'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs Material
        run: pip install -r docs/requirements.txt

      - name: Build the docs site
        run: mkdocs build --strict --site-dir site

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ~/.konan holds the Kotlin/Native distribution AND the per-target LLVM and sysroots konan
      # downloads on demand. Without this the job re-fetches all of it every run; with it, a warm
      # runner skips the download entirely. Every other Kotlin/Native job here already cached it,
      # these two were simply missed.
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-docs-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-docs-

      # BEFORE the FFmpeg trees exist, and that ordering is the whole point. konan fetches its LLVM
      # into ~/.konan/dependencies only when a Kotlin/Native task actually runs. Once a tree IS
      # present, compileKotlin<Target> depends on the ffmpeg cinterop, which depends on our C helper
      # task, so the C task runs FIRST and dies with "No LLVM package with a usable clang" before
      # the Kotlin/Native compiler has ever run. With NO tree, the cinterop is skipped, the compiler
      # runs on the Kotlin sources, LLVM lands, and the compile then fails on unresolved `ffmpeg`
      # references, which is what the `|| true` is for. Warm first, fetch second.
      - name: Warm the Kotlin/Native toolchain
        run: ./gradlew :kiteffmpeg:compileKotlinLinuxX64 --stacktrace || true

      # The HOST triple only, and scoped to match. Fetching all eleven was a mistake: it gave the
      # iOS and macOS targets FFmpeg trees, which registered their C helper tasks, which then tried
      # to run `xcrun` on an Ubuntu runner and failed with "A problem occurred starting process
      # 'command 'xcrun''". A Linux box cannot build Apple targets no matter what it is handed.
      #
      # dokkaGenerate below therefore runs with -Pkiteffmpeg.hostTargetsOnly=true, so only linuxX64
      # is registered and the shared nativeMain metadata compiles against that one. The documented
      # native API is the same either way: it lives in nativeMain, which is shared across every
      # native target. What is lost is per-target ABI detail, not documentation.
      - name: Fetch the prebuilt static FFmpeg (linux-x64)
        env:
          FFMPEG_VERSION: n8.0
          # See ci.yml: the zips moved to a new tag on 2026-08-24 for the aac fix; ffmpeg-n8.0 is
          # left untouched because NOTICE names it as the LGPL source offer for published artifacts.
          FFMPEG_ASSET_TAG: ffmpeg-n8.0-r2
        run: |
          set -euo pipefail
          base="https://github.com/${{ github.repository }}/releases/download/${FFMPEG_ASSET_TAG}"
          asset="ffmpeg-${FFMPEG_VERSION}-lgpl-linux-x64.zip"
          curl -fL --retry 3 -o "${asset}" "${base}/${asset}"
          curl -fL --retry 3 -o "${asset}.sha256" "${base}/${asset}.sha256"
          shasum -a 256 -c "${asset}.sha256"
          mkdir -p native-libs/lgpl/linux-x64
          unzip -q "${asset}" -d native-libs/lgpl/linux-x64
          test -f native-libs/lgpl/linux-x64/lib/libavformat.a
          rm -f "${asset}" "${asset}.sha256"

      # The Dokka generation + merge is required: the deployed site must never
      # silently lose its /api/ reference.
      - name: Generate the Dokka API reference and merge it into the site
        run: |
          ./gradlew dokkaGenerate -Pkiteffmpeg.hostTargetsOnly=true --no-configuration-cache
          mkdir -p site/api
          cp -r build/dokka/html/. site/api/

      - name: Disable Jekyll processing
        run: touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
