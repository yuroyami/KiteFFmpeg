name: Docs

# Builds the MkDocs Material site + the Dokka API reference and deploys both to
# GitHub Pages (https://yuroyami.github.io/KiteCodec/). The API reference lands at
# /api/ to match the "API reference ▸" link in mkdocs.yml.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '**/*.kt'
      - '**/build.gradle.kts'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs Material
        run: pip install -r docs/requirements.txt

      - name: Build the docs site
        run: mkdocs build --strict --site-dir site

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # KiteCodec links FFmpeg from its Kotlin/Native code, so the Dokka job
      # needs the FFmpeg dev libraries present on the runner to analyze/compile
      # the native source sets. Install them before any gradle step.
      - name: Install FFmpeg dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavformat-dev libavcodec-dev libavfilter-dev \
            libavutil-dev libswscale-dev libswresample-dev

      # The C helper tasks compile with konan's own LLVM, which only lands in
      # ~/.konan/dependencies once a Kotlin/Native compile has run. On a fresh
      # runner the C task races it and dies with "No LLVM package with a usable
      # clang", which is how this workflow failed on every push (register row
      # KC-CI-KONAN). ci.yml's consumer jobs and publish.yml both carry this
      # warmup; the docs job was the last one without it.
      - name: Warm the Kotlin/Native toolchain
        run: ./gradlew :kitecodec-core:compileKotlinLinuxX64 --stacktrace || true

      # The Dokka generation + merge is required: the deployed site must never
      # silently lose its /api/ reference.
      - name: Generate the Dokka API reference and merge it into the site
        run: |
          ./gradlew dokkaGenerate --no-configuration-cache
          mkdir -p site/api
          cp -r build/dokka/html/. site/api/

      - name: Disable Jekyll processing
        run: touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
