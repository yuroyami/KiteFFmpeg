name: Docs

# Builds the MkDocs Material site + the Dokka API reference and deploys both to
# GitHub Pages (https://yuroyami.github.io/KiteFFmpeg/). The API reference lands at
# /api/ to match the "API reference ▸" link in mkdocs.yml.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '**/*.kt'
      - '**/module.yaml'
      - 'project.yaml'
      - 'build-plugins/**'
      - 'dokka-templates/**'
      - 'kiteffmpeg/Module.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs Material
        run: pip install -r docs/requirements.txt

      - name: Build the docs site
        run: mkdocs build --strict --site-dir site

      # The Kotlin Toolchain downloads its own JDK, Kotlin/Native and Node into this folder.
      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.konan
          key: kotlin-toolchain-docs-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-docs-

      # The HOST triple only. A Linux runner cannot build the Apple platforms, and the documented
      # native API lives in the shared src@native folder, so one native platform is enough.
      - name: Fetch the prebuilt static FFmpeg (linux-x64)
        env:
          FFMPEG_VERSION: n9.0.2
          # See ci.yml: the zips moved to a new tag on 2026-08-24 for the aac fix; ffmpeg-n8.0 is
          # left untouched because NOTICE names it as the LGPL source offer for published artifacts.
          FFMPEG_ASSET_TAG: ffmpeg-n9.0.2-r3
        run: |
          set -euo pipefail
          base="https://github.com/${{ github.repository }}/releases/download/${FFMPEG_ASSET_TAG}"
          asset="ffmpeg-${FFMPEG_VERSION}-lgpl-linux-x64.zip"
          curl -fL --retry 3 -o "${asset}" "${base}/${asset}"
          curl -fL --retry 3 -o "${asset}.sha256" "${base}/${asset}.sha256"
          shasum -a 256 -c "${asset}.sha256"
          mkdir -p native-libs/lgpl/linux-x64
          unzip -q "${asset}" -d native-libs/lgpl/linux-x64
          test -f native-libs/lgpl/linux-x64/lib/libavformat.a
          rm -f "${asset}" "${asset}.sha256"

      # Dokka reads the standard libraries of the documented platform folders (src@native and
      # src@wasmJs) from the toolchain cache, so one build of each kind comes first.
      - name: Build linuxX64 and wasmJs
        run: ./kotlin build -m kiteffmpeg -p linuxX64 -p wasmJs
        env:
          KOTLIN_CLI_NO_WELCOME_BANNER: 1

      # The Dokka generation + merge is required: the deployed site must never
      # silently lose its /api/ reference.
      - name: Generate the Dokka API reference and merge it into the site
        run: |
          # `do` is a command of the kotlin script here, not the shell keyword.
          # shellcheck disable=SC1010
          ./kotlin do dokka && ./kotlin do dokkaSite
          mkdir -p site/api
          cp -r build/dokka/html/. site/api/
        env:
          KOTLIN_CLI_NO_WELCOME_BANNER: 1

      - name: Disable Jekyll processing
        run: touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
