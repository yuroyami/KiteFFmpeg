  <title id="kiteffmpeg-icon-title">KiteFFmpeg small icon</title>
  <desc id="kiteffmpeg-icon-desc">A compact violet, magenta, plum, and coral diamond kite sharing KitePlayer's silhouette, with the official white FFmpeg mark pressed into the sail.</desc>
  <metadata>
    The official FFmpeg PNG is embedded unmodified for provenance. The rendered inlay uses the graphic-only path from the credited Wikimedia Commons vectorisation: https://commons.wikimedia.org/wiki/File:FFmpeg_Logo_new.svg. FFmpeg is a trademark of Fabrice Bellard. This independent icon is not affiliated with or endorsed by the FFmpeg project.
  </metadata>
